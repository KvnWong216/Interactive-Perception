[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interactive-perception"
version = "0.1.0"
description = "Grounded intervention outcome planning for interactive perception"
readme = "README.md"
requires-python = ">=3.10"

dependencies = []

[project.optional-dependencies]
learned = ["numpy>=1.26", "torch>=2.11,<2.14"]
integration = ["numpy>=1.22,<3", "Pillow>=10"]
molmoact2 = [
  "accelerate>=1.0",
  "einops>=0.7",
  "huggingface-hub[cli]>=0.36,<2",
  "hf-transfer>=0.1.8",
  "numpy>=1.26,<3",
  "Pillow>=10",
  "protobuf>=4.25",
  "safetensors>=0.4",
  "sentencepiece>=0.2",
  "torch==2.11.0",
  "torchvision==0.26.0",
  "transformers==4.57.6",
]
dev = ["numpy>=1.26,<3", "Pillow>=10", "pytest>=8.0", "ruff>=0.12"]

[project.scripts]
ip-smoke = "grounded_interaction.smoke:main"
ip-e1 = "grounded_interaction.e1:main"
ip-serve-molmoact2 = "grounded_interaction.molmoact2:serve_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
