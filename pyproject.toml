[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interactive-perception"
version = "0.1.0"
description = "Grounded intervention outcome planning for interactive perception"
readme = "README.md"
requires-python = ">=3.10"

dependencies = []

[project.optional-dependencies]
learned = ["numpy>=1.26", "torch==2.13.0"]
dev = ["pytest>=8.0", "ruff>=0.12"]

[project.scripts]
ip-smoke = "grounded_interaction.smoke:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
