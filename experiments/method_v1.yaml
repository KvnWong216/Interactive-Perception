{
  "schema_version": "method-v1-config-v1",
  "experiment_id": "full-task-fixed-continuation-dev-v1",
  "models": {
    "proposer_provider": {
      "model": "Qwen/Qwen2.5-VL-3B-Instruct",
      "revision": "66285546d2b821cf421d4f5eb2576359d3770cd3",
      "transformers_version": "4.57.6",
      "processor_use_fast": false,
      "attention_implementation": "sdpa",
      "torch_dtype": "bfloat16",
      "quantization_mode": "none",
      "load_mode": "transformers-from-pretrained-low-cpu-mem-v1",
      "generation": {
        "do_sample": false,
        "num_beams": 1,
        "max_new_tokens": 512
      },
      "coordinate_contract": "qwen25-smart-resized-absolute-xyxy-v1",
      "visual_token_budget_per_image": 256,
      "max_candidates": 6,
      "max_per_primitive": 3,
      "max_history_boundaries": 2
    },
    "executor": {
      "model": "allenai/MolmoAct2-LIBERO",
      "revision": "0d24a92bd1faf321ef497c3bbd5681af97c65aa2",
      "upstream_code_revision": "66b87e64efd99dfd103241418113955cf64dfa9c",
      "endpoint": "http://127.0.0.1:8003",
      "conditioning_mode": "precise_text",
      "norm_tag": "libero",
      "action_horizon": 10,
      "flow_steps": 10
    }
  },
  "primitives": {
    "enabled": ["DIRECT", "OPEN"],
    "disabled": ["REMOVE", "ROTATE", "BRING_CLOSE", "STOP"],
    "onehot_order": ["DIRECT", "OPEN"]
  },
  "execution": {
    "total_control_steps": 300,
    "chunk_replan_steps": 10,
    "direct_steps": 300,
    "open_steps": 100,
    "continuation_direct_steps": 200,
    "switch_rule": "fixed_budget_no_private_predicate"
  },
  "continuation": {
    "id": "qwen-top1-direct-after-open-v1",
    "max_direct_candidates": 3,
    "learned_scorer_calls": 0,
    "allow_information_primitives": false,
    "selection": "first_valid_qwen_rank"
  },
  "outcome_contract": {
    "outcome_name": "full_task_with_fixed_continuation_v1",
    "horizon": 300,
    "failure_handling": "policy_failures_evaluated_infrastructure_failures_unlabelled_v1"
  },
  "collection": {
    "repeats_per_candidate": 2,
    "paired_model_seeds": true,
    "reset_groups": {
      "train": 200,
      "validation": 50,
      "calibration": 0,
      "test": 100
    },
    "information_stratum_counts": {
      "train": {
        "INFORMATION_NECESSARY": 67,
        "INFORMATION_SUFFICIENT": 67,
        "INFORMATION_ACTION_NO_HELP": 66
      },
      "validation": {
        "INFORMATION_NECESSARY": 17,
        "INFORMATION_SUFFICIENT": 17,
        "INFORMATION_ACTION_NO_HELP": 16
      },
      "calibration": {
        "INFORMATION_NECESSARY": 0,
        "INFORMATION_SUFFICIENT": 0,
        "INFORMATION_ACTION_NO_HELP": 0
      },
      "test": {
        "INFORMATION_NECESSARY": 34,
        "INFORMATION_SUFFICIENT": 33,
        "INFORMATION_ACTION_NO_HELP": 33
      }
    },
    "split_unit": "scene_layout_hidden_family"
  },
  "model": {
    "hidden_dim": 256,
    "num_heads": 4,
    "feedforward_dim": 1024,
    "public_state": {
      "enabled": true,
      "proprio_dim": 8,
      "include_remaining_budget_fraction": true
    }
  },
  "training": {
    "seeds": [0, 1, 2],
    "optimizer": "AdamW",
    "learning_rate": 0.0003,
    "weight_decay": 0.01,
    "effective_batch_size": 64,
    "gradient_clip_norm": 1.0,
    "max_epochs": 30,
    "early_stopping": {
      "metric": "validation_nll",
      "patience": 5
    }
  },
  "calibration": {
    "enabled": false,
    "method": "positive_scalar_temperature",
    "fit_split": "calibration"
  },
  "evaluation": {
    "policies": [
      "frozen_vlm",
      "always_direct",
      "always_open",
      "random",
      "single_scorer",
      "deep_ensemble"
    ],
    "bootstrap_unit": "split_group",
    "bootstrap_replicates": 10000,
    "primary_metrics": [
      "final_task_success",
      "nll",
      "brier",
      "information_action_rate",
      "control_steps",
      "vlm_calls",
      "vla_calls",
      "latency",
      "proposal_coverage"
    ]
  }
}
