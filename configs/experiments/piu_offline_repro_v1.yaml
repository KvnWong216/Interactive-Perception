external_empirical_gates:
  - id: external_prompted_vlm_router_identity
    artifact: results/diagnostics/external_prompted_vlm_router_identity_v1.json
  - id: external_prompted_vlm_router_probe
    artifact: results/diagnostics/external_prompted_vlm_router_probe_v1.json
  - id: external_pi05_identity_probe
    artifact: results/diagnostics/external_pi05_endpoint_check_v1.json
  - id: b2_frozen_heuristic_v0_results
    artifact: results/method/piu_fixed_drawer_b2_heuristic_v0_v1.jsonl
  - id: oracle_prompt_screen
    artifact: results/method/original_drawer_oracle_prompt_screen_v2.json
  - id: oracle_prompt_pilot
    artifact: results/method/original_drawer_oracle_prompt_pilot_v2.json
  - id: prospective_oracle_plan
    artifact: results/method/original_drawer_oracle_formal_plan_v1.json
  - id: prospective_oracle_formal_result
    artifact: results/method/original_drawer_oracle_formal_result_v1.json
  - id: open_primitive_certificate
    artifact: results/method/piu_open_primitive_certificate_v1.json
  - id: pick_primitive_certificate
    artifact: results/method/piu_pick_primitive_certificate_v1.json
  - id: place_primitive_certificate
    artifact: results/method/piu_place_primitive_certificate_v1.json
  - id: group_split_manifest
    artifact: data/piu/mainline_v1/split_manifest.json
  - id: real_spatial_prefix_cache
    artifact: data/piu/mainline_v1/spatial_prefix_features.npz
  - id: new_group_disjoint_binding_labels
    artifact: data/piu/mainline_v1/binding_labels.jsonl
  - id: new_group_disjoint_effect_labels
    artifact: data/piu/mainline_v1/action_effect_labels.jsonl
  - id: binder_training_report
    artifact: runs/piu_mainline_v1/binder/training_report.json
  - id: binder_calibration
    artifact: runs/piu_mainline_v1/binder/calibration.json
  - id: effect_training_report
    artifact: runs/piu_mainline_v1/effect/training_report.json
  - id: effect_calibration
    artifact: runs/piu_mainline_v1/effect/calibration.json
  - id: complete_sealed_outcome_matrix
    artifact: results/method/piu_fixed_drawer_sealed_outcomes_v1.jsonl
  - id: main_paired_pilot_plan
    artifact: results/method/piu_fixed_drawer_b8_vs_b0_formal_plan_v1.json
  - id: formal_execution_schedule
    artifact: results/method/piu_fixed_drawer_formal_schedule_v1.json
  - id: sealed_full_loop_report
    artifact: results/method/piu_fixed_drawer_sealed_v1.json
  - id: b6_oracle_effect_trace_results
    artifact: results/method/piu_fixed_drawer_b6_oracle_effect_v1.jsonl
  - id: b7_oracle_binding_results
    artifact: results/method/piu_fixed_drawer_b7_oracle_binding_v1.jsonl

claim_contract:
  synthetic_tests_are_performance_evidence: false
  missing_external_gate_can_be_imputed: false
  old_256_pixel_labels_can_train_main_method: false
  unsealed_results_can_enter_main_table: false
  unqualified_primitive_can_dispatch: false
