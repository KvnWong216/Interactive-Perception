schema_version: piu.offline-repro-manifest.v1
id: piu_mainline_offline_release_v1
status: software_release_candidate

resource_contract:
  local_gpu_memory_mib_max: 1500
  local_model_device: cpu
  local_pi05_checkpoint_load_allowed: false
  local_simulator_gpu_render_allowed: false
  pi05_execution_location: identified_external_server_only

dependency_closure_exceptions:
  - path: results/diagnostics/piu_offline_repro_preflight_v1.json
    rationale: >-
      The release lock cannot contain its own content hash; it is validated as
      the output of this manifest and bound separately by every formal design.
  - path: scripts/pipeline/infer.py
    rationale: >-
      The B2 adapter executes this path only inside a detached worktree at the
      attested frozen tag commit, never from the current release checkout.

