schema_version: calibrated-interaction.experiment.v1
id: candidate_effect_route_qwen25vl3b_v1
seed: 20270822

inputs:
  policy_visible: [prompt, temporal_agentview_rgb, temporal_wrist_rgb, public_action_observation_history]
  forbidden: [semantic_ids, simulator_segmentation, hidden_object_poses, articulated_joint_truth, task_predicates]
  history_frames: 4
  depth: false

model:
  vlm: Qwen/Qwen2.5-VL-3B-Instruct
  vlm_frozen: true
  candidate_text_encoded_by_shared_vlm: true
  interaction_decoder:
    layers: 1
    width: 1024
    attention_heads: 8
    effect_factors: 6
  heads: [effect, route]
  edl: false

training:
  precision: bfloat16
  batch_size_per_device: 2
  gradient_accumulation_steps: 16
  optimizer: adamw
  route_loss: cross_entropy
  effect_loss: binary_cross_entropy
  effect_weight_selection: gradient_norm_match_on_development_then_frozen
  max_gpus: 1
  minimum_gpu_memory_gb: 24
  recommended_gpu_memory_gb: 48

calibration:
  temperature_scaling: true
  route_conformal: LAC
  effect_conformal: per_factor_LAC_with_bonferroni
  alpha: 0.1
  split: calibration

executor:
  capability_registry: configs/capabilities/pi05_libero.yaml
  policy: pi05_libero
  frozen: true
  bridge: deterministic_text
