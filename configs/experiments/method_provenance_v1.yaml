schema_version: calibrated-interaction.provenance.v1
scope: >-
  Provenance audit for the fixed-drawer research cycle. Every rule that can
  change an action, evaluator outcome, experiment branch, or paper conclusion
  must be classified here before it is promoted to a public-input main method.

entries:
  - id: drawer_open_joint_boundary
    location: configs/experiments/original_drawer_paper_cycle_v2.yaml:thresholds.drawer_open_joint_maximum
    value: -0.14
    provenance: simulator_or_physics_contract
    claim_use: main_evaluator
    rationale: The threshold is the upper endpoint of LIBERO's declared open range for the wooden cabinet drawer.
    evidence: third_party/LIBERO/libero/libero/envs/objects/articulated_objects.py default_open_ranges [-0.16, -0.14]

  - id: target_grasp_contact
    location: scripts/pipeline/execute.py:evaluator.target_grasp_contact_success
    value: LIBERO _check_grasp predicate
    provenance: simulator_or_physics_contract
    claim_use: main_evaluator
    rationale: Contact is defined by the simulator gripper/object contact geometry rather than a tuned distance or lift cutoff.
    evidence: LIBERO environment _check_grasp evaluated during action replay

  - id: target_destination
    location: scripts/pipeline/execute.py:evaluator.target_reached_destination
    value: LIBERO in predicate
    provenance: simulator_or_physics_contract
    claim_use: main_evaluator
    rationale: Destination entry and terminal placement use the task's declared spatial predicate.
    evidence: LIBERO _eval_predicate([in, target_object, target_destination_region])

  - id: historical_target_visibility_256
    location: configs/experiments/original_drawer_paper_cycle_v2.yaml:thresholds.target_visible_pixels_minimum
    value: 256 raw pixels
    provenance: unsupported_heuristic
    claim_use: historical_only
    rationale: It approximates one 14x14 policy-image patch after 256-to-224 resize but was not calibrated as a recognition boundary.
    evidence: retained sensitivity audit shows the 8/10 result is invariant for every integer threshold from 1 through 447 raw pixels

  - id: oracle_target_presence
    location: configs/experiments/original_drawer_oracle_target_prompt_pilot_v2.yaml:execution.target_presence_minimum_pixels
    value: 1 raw pixel
    provenance: oracle_intervention
    claim_use: diagnostic_only
    rationale: A nonempty instance mask is a logical precondition for rendering an evaluator-only marker, not a visibility-performance claim.
    evidence: target box is undefined exactly when the target mask has zero pixels

  - id: historical_pick_lift_3cm
    location: retained piu.semantic-option.v1 reports:evaluator.target_pick_success
    value: 0.03 m
    provenance: unsupported_heuristic
    claim_use: historical_only
    rationale: The old rule combined contact at any time with lift at any time and had no recorded calibration source.
    evidence: future v2 reports replace it with grasp contact plus a continuous maximum-lift diagnostic

  - id: historical_executor_count_gates
    location: configs/experiments/original_drawer_paper_cycle_v2.yaml:thresholds.*_gate_count
    value: visible pick 8/10; terminal place 7/10; post-OPEN butter pick 8/10
    provenance: unsupported_heuristic
    claim_use: historical_only
    rationale: These were engineering qualification targets without a power calculation or inferential interpretation.
    evidence: retained paper-cycle config and negative-result report; successor protocols use effect estimates and prospective tests

  - id: oracle_marker_geometry
    location: src/interactive_perception/oracle_visual_prompt.py
    value: padding 4; line width 4; point radius >=6; spotlight multiplier 0.25
    provenance: oracle_intervention
    claim_use: diagnostic_only
    rationale: These are deliberately hand-designed causal interventions and cannot be presented as the public-input method.
    evidence: oracle reports declare two online privileged inputs and retain changed-pixel counts

  - id: pi05_replan_chunk
    location: configs/experiments/original_drawer_oracle_target_prompt_pilot_v2.yaml:execution.replan_steps
    value: 5 steps
    provenance: frozen_policy_contract
    claim_use: main_method_online
    rationale: The frozen pi0.5 LIBERO inference example executes five actions before replanning.
    evidence: frozen OpenPI policy serving/execution contract

  - id: external_pi05_checkpoint_identity
    location: src/piu/policy_identity.py:validate_server_metadata
    value: exact pi05_libero checkpoint-tree identity plus required action_chunks capability and optional validated server-session ID
    provenance: frozen_policy_contract
    claim_use: main_method_online
    rationale: Every prospective external execution validates the same content-addressed checkpoint before the first action. A capability list may add the registered spatial-prefix service, but policy config, environment, checkpoint tree, and metadata field closure cannot drift across B0--B8. New servers expose a random session ID so a phase can detect a mid-run restart without treating the ID as policy identity.
    evidence: the unified executor, baseline/oracle adapters, counterfactual collector, and endpoint probe share one validator; the v2 oracle runner additionally requires a finite action probe, and regression tests accept declared capabilities/session IDs while rejecting a mismatched checkpoint or malformed session identity

  - id: rollout_step_limits
    location: configs/experiments/original_drawer_oracle_target_prompt_pilot_v2.yaml:execution.steps
    value: DIRECT 400; OPEN 300 in retained matrix
    provenance: safety_or_resource_budget
    claim_use: safety_only
    rationale: Step counts cap rollout cost and are reported with budget saturation; they do not certify task completion.
    evidence: controller completion source and executed step counts are retained per report

  - id: controller_decision_cap
    location: configs/experiments/piu_baselines_v1.yaml:shared_contract.maximum_controller_decisions
    value: 8 decisions per episode
    provenance: safety_or_resource_budget
    claim_use: safety_only
    rationale: The cap bounds external execution cost equally across B0--B8 and is frozen before formal outcomes; it does not authorize an action or certify task completion.
    evidence: public loops read the exact registry value, the oracle-effect replay rejects longer traces, and the sealed schedule retains the cap as a resource contract

  - id: local_gpu_cap
    location: configs/experiments/original_drawer_oracle_target_prompt_pilot_v2.yaml:resource_contract.local_gpu_memory_mib_max
    value: 1500 MiB
    provenance: safety_or_resource_budget
    claim_use: safety_only
    rationale: This is the user's resource constraint and forces external pi0.5 serving.
    evidence: external_only resource contract and GPU audit

  - id: formal_test_design_levels
    location: configs/experiments/original_drawer_oracle_target_prompt_pilot_v2.yaml:formal_followup and configs/experiments/piu_formal_analysis_v1.yaml
    value: alpha 0.05; target power 0.80
    provenance: formal_statistical_procedure
    claim_use: main_evaluator
    rationale: Conventional Type-I and Type-II error controls are frozen before formal data and paired with effect sizes and confidence intervals; the five-group pilot is excluded.
    evidence: exact paired binomial test and exact prospective power on an independent formal group set

  - id: formal_pilot_confidence_levels
    location: configs/experiments/piu_formal_analysis_v1.yaml:prospective_design
    value: 0.95 report confidence; 0.95 joint conservative design confidence
    provenance: formal_statistical_procedure
    claim_use: main_evaluator
    rationale: The report interval and conservative power operating point are frozen before any real B8 pilot outcome. Bonferroni allocation plus exact Clopper-Pearson bounds replaces an arbitrary effect-size shrinkage factor.
    evidence: tests block a five-pair perfect pilot whose directional lower bound does not exceed chance and reproduce the exact ten-pair design

  - id: conformal_risk_level
    location: training experiment configs:calibration.alpha
    value: protocol-specific alpha
    provenance: user_risk_contract
    claim_use: main_method_online
    rationale: Alpha represents a declared acceptable marginal miscoverage risk; thresholds themselves are fitted only on calibration data.
    evidence: src/calibrated_interaction/calibration.py finite-sample split-conformal quantile

  - id: conformal_threshold
    location: src/calibrated_interaction/calibration.py:LACCalibrator.fit
    value: calibration order statistic
    provenance: fit_on_isolated_calibration
    claim_use: main_method_online
    rationale: The action-set boundary is calculated from the isolated calibration split rather than manually selected.
    evidence: ceil((n+1)(1-alpha)) finite-sample conformal rank

  - id: rejected_effect_selector_semantics
    location: src/calibrated_interaction/controller.py:CalibratedSelector._effect_reliable
    value: singleton execution success; singleton ambiguity reduction for information actions
    provenance: protocol_identifier
    claim_use: rejected_method_only
    rationale: This semantic rule belonged to the rejected effect-aware pilot and is not an active paper method.
    evidence: paper result reports no route gain and rejects the broad candidate-effect method

  - id: cpu_baseline_feature_fusion
    location: src/calibrated_interaction/cpu_baseline.py:fused
    value: 0.4 agent + 0.4 wrist + 0.2 language
    provenance: baseline_only_heuristic
    claim_use: baseline_only
    rationale: The weights define a deliberately small deterministic diagnostic baseline, not the shared-VLM method.
    evidence: paper and module label the CPU system as development baseline only

  - id: legacy_uncertainty_utilities
    location: src/interaction_uncertainty
    value: multiple manual weights and thresholds
    provenance: baseline_only_heuristic
    claim_use: baseline_only
    rationale: The implementation is frozen as Heuristic V0 and is prohibited from the proposed learned pipeline.
    evidence: baselines/heuristic_v0/README.md and README claim boundary

  - id: frozen_heuristic_v0_comparison_adapter
    location: scripts/pipeline/run_piu_heuristic_v0_inference.py and scripts/pipeline/run_piu_heuristic_v0_once.py
    value: exact tag/commit one-step inference followed by at most its one selected shared physical option
    provenance: baseline_only_heuristic
    claim_use: baseline_only
    rationale: The frozen tag never implemented a full replanning loop. The adapter hash-binds the paired public observation, exact Git commit, every legacy model tree, inference report, and source state, but does not add a second decision. Unsupported legacy observation primitives become recorded abstention; a supported one-step rollout that fails to finish remains a failure.
    evidence: adapter tests check the detached frozen worktree, external-GPU-only plan, shared option budget, exact one-step limit, and standard abstention episode

  - id: decoder_training_hyperparameters
    location: configs/experiments and scripts/training/train_calibrated_interaction.py
    value: architecture width, heads, optimizer, patience, clipping, and gradient-weight bounds
    provenance: numerical_optimization
    claim_use: rejected_method_only
    rationale: These were development choices for a rejected pilot; any successor must predeclare a development-only search and ablation.
    evidence: retained grouped development results and no paper-level method claim

  - id: rejected_four_token_prefix_pooling
    location: scripts/data/extract_candidate_interaction_features.py:PrefixTokenEncoder.encode
    value: prompt last; prompt mean; agent-view global mean; wrist-view global mean
    provenance: unsupported_heuristic
    claim_use: rejected_method_only
    rationale: Reusing the frozen encoder does not justify discarding all spatial token indices through fixed global means.
    evidence: candidate_interaction_stage1 is rejected and has no spatial-pooling ablation or executor-utilization gain

  - id: rejected_candidate_prompt_pooling
    location: scripts/data/extract_candidate_interaction_features.py:candidate_values
    value: mean of prompt-last and prompt-mean summaries
    provenance: unsupported_heuristic
    claim_use: rejected_method_only
    rationale: The fixed average is an uncalibrated architecture choice and not the full prefix interface consumed by the action expert.
    evidence: frozen pilot feature shape is one 2048-wide vector per candidate with no retained token mask or span

  - id: paired_power_search_limit
    location: configs/experiments/piu_formal_analysis_v1.yaml:prospective_design.numerical_search_limit
    value: 200 groups
    provenance: numerical_optimization
    claim_use: safety_only
    rationale: This bounds computation only; failure to find a design blocks the experiment and never counts as evidence against the method.
    evidence: exact paired power is evaluated for every prospective count through the bound; both oracle and main planners read and hash the single frozen config value, with no numeric CLI default

  - id: formal_execution_permutation
    location: configs/experiments/piu_formal_analysis_v1.yaml:execution_schedule
    value: SHA-256-keyed group and within-group B0--B8 permutation
    provenance: protocol_identifier
    claim_use: main_evaluator
    rationale: Method order is derived only from frozen artifact hashes and a declared namespace before outcome collection; it is retained to expose temporal/order effects and cannot select a favorable ordering from outcomes.
    evidence: formal-schedule tests reject pilot-group reuse and the matrix assembler requires the schedule hash, exact seeds, methods, and policy identity

  - id: formal_one_shot_attempt_ledger
    location: scripts/evaluation/begin_piu_formal_attempt.py and scripts/evaluation/close_piu_formal_attempt.py
    value: one immutable ordered ticket and close receipt per scheduled B0--B8 cell
    provenance: protocol_identifier
    claim_use: main_evaluator
    rationale: A sealed method/state cell cannot be launched out of order, redirected to another state/output path, or silently rerun after its result is observed.
    evidence: every runtime entry point requires its exact ticket, every episode retains the ticket hash, and matrix assembly verifies the complete sequential close chain

  - id: formal_initial_state_cohort
    location: scripts/evaluation/build_piu_formal_initial_states.py
    value: one content-addressed opaque NPZ simulator state per sealed initial-state group
    provenance: protocol_identifier
    claim_use: main_evaluator
    rationale: Exact source states are frozen before method outcomes and are transport-only, so paired methods cannot be compared on post hoc state variants and the policy receives no privileged simulator vector.
    evidence: the builder validates split groups/seeds, NPZ key/dtype/finiteness, and unique content; the schedule and matrix bind every state hash

  - id: formal_offline_release_lock
    location: results/diagnostics/piu_offline_repro_preflight_v1.json
    value: content-addressed inventory of all required mainline code and configs
    provenance: protocol_identifier
    claim_use: main_evaluator
    rationale: Pilot planning and schedule freezing validate every inventory hash before reading outcomes, including local import and literal runtime dependencies, so a schedule cannot silently use changed transitive executor code.
    evidence: reproduction tests reject source drift and an untracked local import; the inventory includes the executor, external client, scene config/BDDL, policy identity, oracle renderer, and runtime safety scripts

  - id: empirical_artifact_completion
    location: configs/experiments/piu_empirical_stage_dag_v1.yaml and src/piu/empirical_dag.py
    value: dependency-ordered semantic revalidation rather than file presence
    provenance: protocol_identifier
    claim_use: main_evaluator
    rationale: External authority and endpoint availability are independent prerequisites. A retained file can unlock a successor only after its schema, recursive hashes, frozen identity, complete prospective denominator, group/seed assignment, and method-specific firewall are revalidated.
    evidence: DAG tests reject infeasible task-owner risk values and endpoint identity drift; the sealed validator reloads the exact schedule and requires every scheduled group/method/seed/state/policy cell, including the complete B6 and B7 columns; release SVGs must embed the regenerated evidence-table hash exactly once

  - id: oracle_prompt_phase_execution_order
    location: configs/experiments/original_drawer_oracle_target_prompt_schedule_v1.yaml
    value: SHA-256-keyed permutation within screen and confirmation phases
    provenance: protocol_identifier
    claim_use: diagnostic_only
    rationale: The nine style-by-group screen cells and five confirmation groups execute in a content-bound order frozen before that phase's outcomes, preventing style-blocked temporal drift from becoming an unrecorded confound.
    evidence: the schedule builder binds the unchanged v2 experiment, offline release, source-state hashes, expected report paths, and prior unique screen selection; the runner rejects reordered or incomplete schedules, endpoint-session drift, and phase reports spanning multiple sessions

  - id: oracle_formal_attempted_open_pairing
    location: configs/experiments/piu_oracle_formal_v1.yaml, src/piu/oracle_formal.py, and scripts/pipeline/run_oracle_formal_group.py
    value: hash-permuted new groups with one qualified attempted OPEN followed by randomized oracle-target-prompt and raw-post-OPEN DIRECT arms from the identical transported state
    provenance: protocol_identifier
    claim_use: diagnostic_only
    rationale: The formal causal estimand cannot condition on successful OPEN, reuse screen/pilot seeds, select an arm order after outcomes, or drop an executor failure. Every started group is single-use; failed or interrupted OPEN/arm execution remains a false intention-to-treat outcome in both the exact paired test and reported effect.
    evidence: schedule/receipt tests bind the pilot-sized count, exact OPEN certificate/candidate, split, opaque state, release lock, endpoint session, arm reports, public starting RGB, and evaluator recomputation; interruption closes conservatively and cannot be rerun

  - id: binding_mask_to_patch_target
    location: src/piu/binding_data.py:mask_to_patch_coverage
    value: exact target-pixel fraction per frozen patch
    provenance: protocol_identifier
    claim_use: main_evaluator
    rationale: Every nonempty fraction is retained; no pixel-count or confidence boundary is introduced.
    evidence: exact RLE round-trip and patch-alignment tests

  - id: binding_multitask_weighting
    location: src/piu/target_binding.py:LearnedMultiTaskObjective
    value: learned homoscedastic log variances
    provenance: learned_on_training_split
    claim_use: main_method_online
    rationale: Objective scales are optimized on training groups; unsupported label families are masked and no manual loss weights are accepted.
    evidence: trainer contract and gradient tests

  - id: binding_architecture_search
    location: configs/experiments/piu_binding_adapter_v1.yaml:model_search
    value: declared finite development-only grid
    provenance: learned_on_training_split
    claim_use: main_method_online
    rationale: Width, dropout, learning rate, and seed are retained for every trial and selected without calibration or sealed data.
    evidence: CPU trainer report schema and synthetic end-to-end test

  - id: cpu_training_thread_budget
    location: configs/experiments/piu_binding_adapter_v1.yaml:compute.torch_threads and configs/experiments/piu_action_effect_v1.yaml:compute.torch_threads
    value: 2 CPU threads
    provenance: safety_or_resource_budget
    claim_use: safety_only
    rationale: The fixed thread count bounds and stabilizes local CPU work; it never changes an online action or evaluator outcome.
    evidence: both CPU training entry points apply the declared thread count before model optimization

  - id: training_parameter_resource_cap
    location: configs/experiments/piu_binding_adapter_v1.yaml:model_search.maximum_parameter_count and configs/experiments/piu_action_effect_v1.yaml:model_search.maximum_parameter_count
    value: 2000000 trainable parameters
    provenance: safety_or_resource_budget
    claim_use: safety_only
    rationale: The cap bounds local training memory and rejects oversized trials; it is not a model-selection score or success threshold.
    evidence: both trainers reject a model whose trainable parameter count exceeds the declared cap

  - id: binding_conformal_risk_contract
    location: configs/experiments/piu_binding_calibration_v1.yaml:risk_contract
    value: primary alpha 0.10; report alpha 0.05, 0.10, 0.20
    provenance: user_risk_contract
    claim_use: main_method_online
    rationale: Risk levels are frozen before real calibration data; order-statistic thresholds are fit on a group-disjoint conformal role.
    evidence: preregistration amendment 1 and calibration pipeline tests

  - id: primitive_absolute_reliability_contract
    location: configs/experiments/piu_executor_risk_allocation_v1.yaml
    value: externally declared episode failure budget delta; per-dispatch null rate 1-delta/M under an equal Bonferroni allocation; externally declared maximum qualification groups per primitive
    provenance: user_risk_contract
    claim_use: safety_only
    rationale: The historical 8/10 gate, conformal alpha, retrospective successes, and a CLI search default cannot set executor risk or collection scale. M is the frozen maximum of eight physical dispatches; delta, the power-design alternative, and the positive-integer collection-resource cap must be declared externally before qualification outcomes, and the union bound assumes no independence.
    evidence: risk-contract loader re-derives every rate and revalidates the collection cap from the hash-bound external budget, baseline registry, and protocol inputs; the template contains no numeric defaults

  - id: primitive_qualification_group_resource_cap
    location: configs/templates/piu_external_execution_risk_budget_template.yaml:maximum_qualification_groups_per_primitive
    value: externally declared positive integer with no repository default
    provenance: safety_or_resource_budget
    claim_use: safety_only
    rationale: This bounds external collection cost and decides only whether a powered design fits the declared resources; it does not authorize an action or define empirical success.
    evidence: derivation rejects null/noninteger caps, the planner has no CLI/default cap, and risk/plan loaders bind the exact externally declared value

  - id: retrospective_primitive_semantics
    location: configs/experiments/piu_primitive_registry_v2.yaml
    value: OPEN plus compound DIRECT contact/destination diagnostics; PICK and PLACE remain unevaluated
    provenance: protocol_identifier
    claim_use: diagnostic_only
    rationale: The retained visible-object and post-OPEN runs executed a compound DIRECT instruction. Their contact or destination endpoints cannot be relabeled as separately tested PICK or PLACE primitives, and their rates cannot set the prospective effect size.
    evidence: the v2 immutable registry retains exact source candidate IDs, semantic options, report hashes, and an empty authorized action set

  - id: full_candidate_prefix_serialization
    location: src/piu/spatial_prefix.py:candidate_conditioned_prompt
    value: complete public candidate fields plus pre/post prompt tokens and masks
    provenance: protocol_identifier
    claim_use: main_method_online
    rationale: Candidate text is a typed public interface retained as a full frozen token sequence; it is not compressed by a fixed numerical pooling rule.
    evidence: spatial-prefix and action-effect regression tests retain candidate IDs, primitives, time order, token masks, and all valid hidden states

  - id: public_executed_action_history
    location: scripts/data/extract_piu_spatial_prefix_features.py:public_executed_action
    value: semantic candidate identity copied from public execution history
    provenance: protocol_identifier
    claim_use: main_method_online
    rationale: Action conditioning is the action the controller actually dispatched, not an evaluator-provided correct-action label or a hidden simulator event.
    evidence: extraction rejects absent, incomplete, or non-candidate public executed actions and the label join separately checks agreement

  - id: public_candidate_enumeration
    location: src/piu/candidate_generator.py:generate_candidates
    value: expand every registered public affordance plus a PICK/PLACE task-action superset, REPORT_NOT_FOUND, and STOP
    provenance: protocol_identifier
    claim_use: main_method_online
    rationale: The generator enumerates all public affordances and never selects the hidden correct container, reads a task predicate, or accepts an injected holding belief. Both PICK and PLACE remain until the independently calibrated post-observation binder gates execution, avoiding a circular feature dependency.
    evidence: leakage tests reject privileged and holding-state fields and verify that all declared affordances plus both task actions are retained

  - id: public_post_observation_memory
    location: src/piu/temporal_memory.py:PublicTemporalMemory
    value: hash-chained region-empty and task-complete sets from calibrated post-observation verifier heads
    provenance: protocol_identifier
    claim_use: main_method_online
    rationale: Search memory accepts only beliefs inferred after reobservation and never propagates predicted execution or task-progress effects as accomplished facts. Holding and task-complete action gates come directly from the current calibrated binder.
    evidence: memory-update tests verify causal observation hashes, reject broken state chains, and require every public information source to be singleton empty before NOT_FOUND

  - id: canonical_public_observation_identity
    location: src/piu/contracts.py:public_observation_sha256
    value: decoded RGB uint8 pixel SHA-256 plus canonical public robot state
    provenance: protocol_identifier
    claim_use: main_method_online
    rationale: Causal branch alignment is invariant to PNG encoder bytes while each file retains a separate integrity SHA-256. Legacy file-only observations are domain-tagged and cannot collide with prospective pixel hashes.
    evidence: regression tests show identical pixels with different file hashes produce one causal identity and extractors verify both file and pixel hashes

  - id: post_observation_verifier_supervision
    location: scripts/data/export_piu_post_observation_labels.py
    value: evaluator-only target masks, target holding, task predicate, and protocol-bound nullable sufficiency/region-empty labels
    provenance: protocol_identifier
    claim_use: diagnostic_only
    rationale: Deployment never reads simulator predicates. Unsupported semantic annotations remain null rather than being replaced by visibility thresholds or expected action effects.
    evidence: label contract and dry-run tests verify state hashes, blinded annotation provenance, and the public/evaluator firewall

  - id: calibrated_post_observation_holding_belief
    location: src/piu/target_binding.py:PromptConditionedTargetBinder.holding_head
    value: class-conditional conformal set over requested-target holding after observation
    provenance: learned_on_training_split
    claim_use: main_method_online
    rationale: PICK/PLACE authorization uses a calibrated belief inferred after reobservation from public RGB, gripper state, prompt, and action history; evaluator grasp identity is supervision only.
    evidence: label firewall, isolated calibration, online prediction, and controller singleton-gate tests

  - id: action_effect_multitask_weighting
    location: src/piu/action_effect.py:LearnedEffectObjective
    value: learned homoscedastic log variances for supported route/effect objectives
    provenance: learned_on_training_split
    claim_use: main_method_online
    rationale: Task scales are optimized on training groups and unsupported factors remain masked, replacing manual information-value and loss weights.
    evidence: route-only, stop-gradient-effect, and joint-effect training tests verify finite learned objectives without fixed scalar utilities

  - id: action_effect_causal_state_alignment
    location: src/piu/action_effect.py:join_effect_features
    value: feature decision-observation SHA-256 equals candidate-outcome pre-observation SHA-256
    provenance: protocol_identifier
    claim_use: main_method_online
    rationale: The model scores a candidate from the public state before that candidate executes; its outcome post frame cannot leak into the predictor input.
    evidence: label parsing and join tests reject null-transition drift, mismatched decision states, and old labels without causal hashes

  - id: counterfactual_candidate_execution_eligibility
    location: src/piu/execution_plan.py:candidate_eligibility
    value: typed binder-only primitive preconditions evaluated before a physical fork
    provenance: protocol_identifier
    claim_use: main_method_online
    rationale: The public candidate superset remains unchanged, but a physical branch is collected only when the calibrated binder establishes the same sufficiency, holding, presence, and spatial prerequisites used by the controller. No predicted effect or outcome selects its own training branch. An ineligible candidate keeps its independently annotated route target while every unobserved effect is null/masked.
    evidence: execution-plan, collector, label-parser, and matrix-export tests verify public hash binding, deterministic prompt serialization, no execution outcome, and complete effect masking for ineligible candidates

  - id: action_effect_architecture_search
    location: configs/experiments/piu_action_effect_v1.yaml:model_search
    value: declared finite development-only grid across all three gradient variants
    provenance: learned_on_training_split
    claim_use: main_method_online
    rationale: Width, dropout, learning rate, seed, and checkpoint epoch are selected only by proper scores on development groups and every trial is retained.
    evidence: CPU trainer rejects calibration/test inputs and writes each variant checkpoint, trial record, and raw development predictions

  - id: learned_effect_to_route_bridge
    location: src/piu/action_effect.py:CandidateConditionedEffectPredictor.forward
    value: route head consumes the interaction token concatenated with predicted factor probabilities
    provenance: learned_on_training_split
    claim_use: main_method_online
    rationale: Effect prediction can influence route logits through trained parameters without a hand-weighted information-value score; gradient routing is controlled only by the declared ablation variant.
    evidence: action-effect tests verify the route-head input width and route-only, stop-gradient-effect, and joint-effect gradients

  - id: action_effect_conformal_risk_contract
    location: configs/experiments/piu_action_effect_calibration_v1.yaml:risk_contract
    value: primary alpha 0.10; report alpha 0.05, 0.10, 0.20
    provenance: user_risk_contract
    claim_use: main_method_online
    rationale: Route and factor risks are frozen before real calibration; thresholds are finite-sample statistics from group-disjoint calibration roles.
    evidence: calibration tests cover dynamic candidate counts, unsupported factors, and isolated temperature/conformal groups

  - id: calibrated_controller_singleton_semantics
    location: src/piu/calibrated_controller.py:decide
    value: singleton route, belief, and required-effect prediction sets; STOP, ABSTAIN, and REPORT_NOT_FOUND are distinct
    provenance: protocol_identifier
    claim_use: main_method_online
    rationale: These are typed logical authorization conditions with no confidence cutoff, top-1 fallback, or manually weighted utility.
    evidence: controller tests verify each execution, interaction, abstention, task-completion, and exhaustive-search branch

  - id: uncalibrated_ablation_unique_argmax
    location: src/piu/ablation_controller.py:decide_unique_argmax
    value: B3/B4 choose the unique maximum route logit and abstain on exact ties
    provenance: protocol_identifier
    claim_use: baseline_only
    rationale: The uncalibrated comparison needs a deterministic decision rule, but array order is not allowed to resolve an exact tie and no confidence cutoff is introduced.
    evidence: ablation-controller tests check unique selection and tie abstention; B3 fixes the effect channel to exact zeros while B4 enables predicted effects

  - id: prompted_vlm_router_protocol
    location: scripts/pipeline/run_piu_prompted_vlm_router.py
    value: exact external server identity and request hash; one registered candidate ID or ABSTAIN
    provenance: protocol_identifier
    claim_use: baseline_only
    rationale: B1 is a frozen prompted-VLM comparison without learned effects or calibration. The identity requires an explicit model revision and capability; an unknown candidate is retained as abstention and is never repaired by a heuristic fallback.
    evidence: endpoint-contract tests verify public RGB/prompt/history/candidates, response-field closure, request binding, retained response transcript, source/identity hashes, and hallucinated-candidate abstention

  - id: development_baseline_arm_assembly
    location: scripts/evaluation/assemble_piu_development_episode_arm.py
    value: exact development group x method arm with registered policy identity
    provenance: protocol_identifier
    claim_use: baseline_only
    rationale: A B2 feasibility artifact cannot be made by selecting successful legacy episodes or concatenating an incomplete subset. Every prospectively assigned development group appears once with its frozen seed, unique opaque source state, public history, and the registered pi0.5 identity.
    evidence: assembly tests accept the complete frozen arm and reject a missing development group; the empirical DAG independently revalidates the same denominator

  - id: calibrated_no_spatial_bridge_ablation
    location: scripts/pipeline/run_piu_calibrated_controller.py:main
    value: B5 uses calibrated route/belief/effect sets but serializes no spatial reference; B8 enables the calibrated spatial bridge
    provenance: protocol_identifier
    claim_use: baseline_only
    rationale: This isolates the contribution of passing learned target geometry to the same frozen executor without changing candidates, scores, calibration, or budgets.
    evidence: controller tests require an explicit spatial-gate override and report the method ID and bridge state

  - id: oracle_effect_branch_selection
    location: scripts/pipeline/replay_piu_oracle_effect_trace.py
    value: follow the unique evaluator selection_correct branch in each exact same-state counterfactual matrix
    provenance: oracle_intervention
    claim_use: diagnostic_only
    rationale: B6 intentionally loads executed outcome labels online to measure a perfect-effect upper bound; it is never eligible for a public-method comparison or method selection.
    evidence: oracle trace tests verify label declaration, formal primitive certificates, and both public-observation and opaque-state continuity

  - id: oracle_binding_full_loop_activation
    location: scripts/pipeline/run_piu_oracle_binding_full_loop.py
    value: development-selected marker is an audited RGB no-op while the target mask is empty and activates only when the target becomes visible
    provenance: oracle_intervention
    claim_use: diagnostic_only
    rationale: B7 starts from the same paired hidden-target state as B0. It reads evaluator target identity and segmentation at every policy call, but does not fabricate a marker before the target exists in either camera. The visual style must be uniquely selected by the frozen development screen and cannot be chosen from formal outcomes.
    evidence: visual-prompt tests prove the empty-mask transformation is pixel-identical; the B7 runner binds the style artifact, external policy identity, source state, full policy-call audit, and standard closed-loop episode schema

  - id: calibrated_spatial_subtask_bridge
    location: src/piu/executor_bridge.py:serialize_pi05_subtask
    value: exact enclosing normalized boxes of every calibrated current-frame patch, serialized with the selected public primitive and referent
    provenance: protocol_identifier
    claim_use: main_method_online
    rationale: PICK and DIRECT cannot execute without a nonempty current-frame conformal patch set, and no score threshold, oracle mask, confidence value, or chain of thought enters the frozen executor prompt.
    evidence: executor-bridge and controller tests check latest-frame filtering, exact patch enclosure, privileged-field rejection, and spatial abstention

  - id: formally_qualified_primitive_certificate
    location: scripts/evaluation/evaluate_piu_primitive_qualification.py
    value: exact one-sided binomial rejection under a prospectively frozen external risk contract, hash-permuted new-group schedule, and complete single-use denominator
    provenance: formal_statistical_procedure
    claim_use: main_evaluator
    rationale: A historical count or shared step budget cannot authorize physical execution. The certificate binds the exact public candidate payload, spatial-serializer mode, per-state public decision/probe report, opaque state, simulator seed, policy identity, execution receipt, and registered simulator/task success predicate; a failed started attempt remains a failure.
    evidence: qualification and dispatch tests reject incomplete denominators, changed prompts/candidates, unscheduled reports, reused states/seeds, fabricated outcomes, and unqualified physical actions

  - id: primitive_qualification_single_use_schedule
    location: scripts/evaluation/build_piu_primitive_qualification_schedule.py and scripts/pipeline/run_piu_primitive_qualification.py
    value: SHA-256-keyed order over exact new states with one immutable attempt path per group
    provenance: formal_statistical_procedure
    claim_use: main_evaluator
    rationale: Public controller reports or the OPEN-only plan-bound probe and their serialized subtasks are frozen before physical outcomes. Endpoint identity is checked before STARTED; after STARTED, runtime failure is counted and the same state cannot be rerun. Interrupted attempts have an explicit failure-only close path.
    evidence: schedule and receipt loaders revalidate split roles, unique state hashes, old-seed exclusion, release lock, exact candidate serialization, order, attempt tickets, and v2 semantic reports

  - id: open_executor_qualification_probe
    location: scripts/evaluation/build_piu_primitive_qualification_probe.py
    value: exact OPEN candidate read from a public candidate-set row and the prospectively frozen primitive plan, serialized without a trained model or calibration artifact
    provenance: protocol_identifier
    claim_use: main_evaluator
    rationale: OPEN must be qualified before new interaction data can be collected, so requiring a trained controller would create a circular dependency. The probe measures executor reliability for a predeclared stimulus only and cannot count as method selection. It is OPEN-only; PICK/DIRECT still require calibrated current-frame spatial references from the learned public-input path.
    evidence: probe and schedule loaders hash-check the plan and public candidate set, reject outcome/oracle/model/calibration inputs, and reject using the model-free probe for PICK

  - id: binder_grounded_task_primitive_qualification_stimulus
    location: scripts/evaluation/build_piu_binding_qualification_stimulus.py
    value: preregistered PICK/PLACE/DIRECT candidate gated by recomputed frozen-binder calibration sets and exact current-frame spatial serialization, without an effect model
    provenance: protocol_identifier
    claim_use: main_evaluator
    rationale: Task-primitive certificates must precede executed effect-data collection, so requiring the later effect-aware controller would be circular. This artifact does not select a route; it freezes the plan-selected candidate only when the isolated binder establishes the deployed typed preconditions. PICK/DIRECT retain nonempty calibrated boxes, PLACE retains calibrated holding, and outcomes/effect predictions remain absent.
    evidence: the stimulus and schedule loaders re-hash every public/model/calibration/split input, recompute eligibility and serialization, reject hand-edited boxes, and forbid the qualification split from action-effect collection

  - id: evidence_bound_paper_figures
    location: scripts/evaluation/build_piu_paper_figures.py
    value: deterministic method and evidence-boundary SVGs generated from frozen contracts and the hash-checked v1 evidence table
    provenance: protocol_identifier
    claim_use: main_evaluator
    rationale: Observed physical counts, software verification, and missing successor evidence are rendered as separate visual classes. PENDING is explicit, automatic method success remains null, and no handwritten metric enters the figures.
    evidence: figure tests reject weakened missing-data semantics and byte-verify both immutable SVG outputs

  - id: public_claim_surface_semantics
    location: src/calibrated_interaction/provenance.py:audit_claim_surfaces
    value: required evidence-boundary statements plus an explicit retired-interpretation denylist on paper, README, status, and results
    provenance: protocol_identifier
    claim_use: main_evaluator
    rationale: Public prose must not silently restore a deprecated pixel recognition threshold or relabel endpoints from compound DIRECT trajectories as independently qualified PICK/PLACE primitives.
    evidence: the audit hashes every public claim surface, checks required missing-evidence and primitive-semantics qualifiers, and fails on every registered retired fragment

  - id: frechet_joint_diagnostic
    location: src/piu/calibrated_controller.py:frechet_joint_lower_bound
    value: max(0, p_execution + p_outcome - 1)
    provenance: formal_statistical_procedure
    claim_use: diagnostic_only
    rationale: The bound reports a conservative joint-event diagnostic without assuming independence and is explicitly prohibited from selecting an action.
    evidence: controller returns the value only in diagnostic_values after the set-valued decision is fixed

  - id: sealed_primary_paired_test
    location: configs/experiments/piu_formal_analysis_v1.yaml:primary
    value: B8 versus B0 target grasp contact; two-sided exact paired binomial test at alpha 0.05
    provenance: formal_statistical_procedure
    claim_use: main_evaluator
    rationale: The initial-state group is the paired unit and the endpoint/comparison are frozen before sealed outcomes exist.
    evidence: src/piu/statistics.py reproduces the retained eight-discordance p-value and rejects incomplete method matrices

  - id: sealed_secondary_holm_family
    location: configs/experiments/piu_formal_analysis_v1.yaml:secondary
    value: Holm familywise adjustment at alpha 0.05
    provenance: formal_statistical_procedure
    claim_use: main_evaluator
    rationale: All named secondary comparisons form one predeclared family; no result-dependent endpoint selection is allowed.
    evidence: monotone Holm implementation and formal-analysis regression tests

  - id: paper_table_missingness_contract
    location: configs/experiments/piu_robustness_reporting_v1.yaml:claim_contract
    value: absent artifacts and absent metrics render as PENDING, never zero; no automatic method-success threshold
    provenance: protocol_identifier
    claim_use: main_evaluator
    rationale: A submission table must not turn an unavailable external experiment into a numerical failure or success, and component metrics cannot automatically establish the end-to-end claim.
    evidence: the hash-checking table builder rejects schema/provenance drift, preserves oracle columns, and has immutable/verification regression tests

  - id: same_scenario_prompt_stress
    location: configs/experiments/piu_robustness_reporting_v1.yaml:same_scenario_prompt_stress
    value: four prespecified semantics-preserving butter-to-basket prompts crossed within each new initial-state group
    provenance: protocol_identifier
    claim_use: main_evaluator
    rationale: Pairing all variants within a state diagnoses lexical prompt dependence without conflating it with simulator state, choosing a model, or claiming broad OOD generalization.
    evidence: the reporting validator requires selection_use none, cluster grouping by initial-state group, and an explicit same-scenario-only claim boundary

claim_surfaces:
  - path: paper/main.md
    required_fragments:
      - the evaluator instance mask is nonempty before DIRECT begins
      - these rollouts do not separately qualify PICK or PLACE primitives
      - "`PENDING` is missing evidence, never an encoded zero"
      - Prospective PICK/PLACE reliability remains unmeasured
  - path: README.md
    required_fragments:
      - endpoint diagnostic, not separate PICK/PLACE qualification
      - Missing artifacts are never printed as zero
  - path: STATUS.md
    required_fragments:
      - PICK and PLACE remain unevaluated as separate primitives
      - No primitive is called formally qualified
  - path: RESULTS.md
    required_fragments:
      - authorizes no paper-method primitive
      - no external budget or certificate exists

retired_claim_fragments:
  - id: fixed_visibility_threshold_as_evidence
    fragment: butter crosses a fixed evaluator visibility threshold
    replacement: State that the evaluator instance mask is nonempty and keep the historical 256-pixel value diagnostic-only.
  - id: direct_endpoint_called_pick_result
    fragment: DIRECT after actual OPEN | butter visible initially 8/10; pick 0/10
    replacement: Report a nonempty mask and grasp-contact endpoint for the compound DIRECT rollout.
  - id: direct_control_called_pick_qualification
    fragment: visible-object executor control | pick 10/10
    replacement: Report compound DIRECT contact and terminal destination endpoints without primitive relabeling.
  - id: historical_placement_gate_as_current_conclusion
    fragment: placement gate fails
    replacement: Label the old gate historical and report the task destination predicate continuously/by count.
  - id: stale_named_pick_primitive
    fragment: PICK-visible-work-surface
    replacement: Retrospective artifacts executed DIRECT; prospective PICK remains unevaluated.
  - id: stale_named_post_open_pick_primitive
    fragment: PICK-post-OPEN
    replacement: Retrospective artifacts executed DIRECT after OPEN; prospective PICK remains unevaluated.
  - id: stale_named_place_primitive
    fragment: PLACE-visible-work-surface
    replacement: Retrospective artifacts executed DIRECT; prospective PLACE remains unevaluated.

