schema_version: piu.offline-repro-manifest-extension.v2
id: piu_mainline_offline_release_v3
status: post_s00_external_artifact_boundary_amendment
base_manifest: configs/experiments/piu_offline_repro_v1.yaml

resource_contract:
  local_gpu_memory_mib_max: 1500
  local_model_device: cpu
  local_pi05_checkpoint_load_allowed: false
  local_simulator_gpu_render_allowed: false
  pi05_execution_location: identified_external_server_only

empirical_stage_dag: configs/experiments/piu_empirical_stage_dag_v1.yaml

added_dependency_closure_exceptions:
  - path: results/diagnostics/piu_offline_repro_preflight_v2.json
    rationale: The retained v2 extension lock is historical amendment evidence.
  - path: results/diagnostics/piu_offline_repro_preflight_v3.json
    rationale: >-
      The v3 release lock cannot contain its own content hash; it is validated
      as this extension's output and bound separately by formal designs.
  - path: results/diagnostics/external_pi05_endpoint_check_v1.json
    rationale: >-
      This is a prospective external empirical gate validated by the stage DAG,
      not an offline-release input; its later presence must not change the
      retained CPU-only inventory.

added_required_files:
  - configs/experiments/piu_offline_repro_v2.yaml
  - results/diagnostics/piu_offline_repro_preflight_v2.json
  - results/diagnostics/piu_public_claim_audit_v2.json
  - configs/experiments/piu_offline_repro_v3.yaml
  - configs/experiments/piu_empirical_compute_contract_v1.yaml
  - src/piu/compute_provenance.py
  - results/diagnostics/piu_public_claim_audit_v3.json

added_python_entrypoints: []
added_external_empirical_gates: []

claim_contract:
  synthetic_tests_are_performance_evidence: false
  missing_external_gate_can_be_imputed: false
  old_256_pixel_labels_can_train_main_method: false
  unsealed_results_can_enter_main_table: false
  unqualified_primitive_can_dispatch: false
