schema_version: interaction-uncertainty.piu-config.v0
name: PIU-V0-T01
status: prototype_development_only

hardware:
  local_gpu: 0
  detected_device: NVIDIA GeForce RTX 4080 SUPER
  memory_gib: 16
  inference_schedule: one frozen pi05 action+prefix server
  future_qwen_schedule: sequential_not_concurrent_with_pi05

public_inputs:
  - full_user_prompt
  - stock_agentview_rgb
  - stock_wrist_rgb
  - public_robot_state
  - public_action_history
  - six_public_history_points
forbidden_online_inputs:
  - drawer_joint
  - segmentation
  - hidden_target_pose
  - target_true_location
  - task_success_predicate
  - bev_or_global_camera
  - simulator_semantic_id

task_facts:
  target_location:
    values:
      - visible_workspace
      - middle_drawer
      - other_unsearched_region
      - absent
    trained_v0: [visible_workspace, middle_drawer]
    unsupported_v0: [other_unsearched_region, absent]

encoder:
  model: frozen_pi05_libero_paligemma_prefix
  global_schema: global_v1
  effect_schema: cognitive_spatial_v5
  trainable: false

sidecar:
  artifact: results/models/piu_v0_4_sidecar.pt
  projected_dimension: 256
  hidden_dimension: 128
  heads:
    - initial_task_belief
    - semantic_handoff_rank
    - action_effect_forecast
    - six_frame_outcome
    - outcome_conditioned_future_belief
  conformal_alpha: 0.10

actions:
  v0:
    - DIRECT_ACT
    - OPEN_TO_INSPECT
    - STOP_NOT_FOUND
    - COMPLETE
    - ABSTAIN
  direct_act_endpoint: semantic_handoff_only
  open_to_inspect_executor: frozen_pi05_plus_public_proprioceptive_return
  open_primitive_reliability:
    point_estimate: 0.97
    trials: 100
    one_sided_95_lower_bound: 0.924
    optimizer_value: 0.924

optimizer:
  information_weight: 1.0
  task_progress_weight: 1.5
  cost_weight: 1.0
  risk_weight: 0.25
  open_to_inspect_cost: 0.18
  direct_handoff_cost: 0.10
  rule: maximize_expected_information_and_task_utility_over_hard_valid_candidates
  confidence_threshold_router: false

outcome:
  labels: [FAILED, REVEALED, EMPTY]
  history: [before, quarter, half, three_quarters, end, returned]
  prompt_resolvable_pixels: 256
  ambiguity: ABSTAIN
  empty_scope: local_only

smoke:
  seed: 1399
  report: results/smoke/piu_v0_full_pipeline_v4_seed1399.json
  paper_eligible: false
