schema_version: interaction-uncertainty.piu-code-ownership.v0
active_piu_runtime:
  package:
    - src/interaction_uncertainty/contracts.py
    - src/interaction_uncertainty/task_parser.py
    - src/interaction_uncertainty/scene_memory.py
    - src/interaction_uncertainty/candidates.py
    - src/interaction_uncertainty/sidecar.py
    - src/interaction_uncertainty/optimizer.py
  embodied_entrypoint:
    - scripts/run_piu_v0_smoke.sh
    - scripts/run_piu_v0_smoke.py
  learning_entrypoints:
    - scripts/build_piu_v0_dataset.py
    - scripts/train_piu_v0.py
  safety_entrypoint:
    - scripts/audit_piu_v0.py

retained_legacy_dependencies:
  - files:
      - src/interactive_perception/closed_loop.py
      - src/interactive_perception/primitive_decoder.py
      - src/interactive_perception/rollout.py
      - scripts/run_challenge_rollout.py
    reason: Still form one historical challenge-runner dependency chain and have direct tests.
    piu_v0_runtime_dependency: false
  - files:
      - src/interactive_perception/temporal_belief.py
      - src/interactive_perception/pipeline.py
      - src/interactive_perception/active_risk.py
    reason: Retained only for historical gate/result reproduction and direct regression tests; PIU V0 bypasses probabilistic q.
    piu_v0_runtime_dependency: false
  - file: src/interaction_uncertainty/__init__.py
    reason: Temporarily extends the namespace because the retained historical chain imports the sibling legacy research package.
    removal_condition: Remove with the historical challenge runner in one dedicated cleanup change after its evidence is archived.

deleted_as_unambiguously_generated:
  - src/interaction_uncertainty/__pycache__

deletion_rule: >-
  Delete only dependency-proven unused files. Do not delete claim provenance,
  historical reproduction entrypoints, directly tested modules, or files with
  pre-existing user edits as a side effect of the PIU migration.
