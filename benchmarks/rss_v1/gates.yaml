schema_version: interactive-perception.rss-method-gates.v1
name: Prompt-Aligned Action-Resolvable Uncertainty — RSS Evidence Ladder

decision_rule: GO only if every blocking gate is GO; PARTIAL counts as NOT-GO
frozen_statistics:
  conformal_error_rate: 0.05
  confidence: 0.95
  minimum_action_reliability_lower_bound: 0.80
  original_strict_action_reliability_reported_also: 0.90

paper_claim: >-
  A lightweight wrapper around a frozen VLA represents prompt-relevant hidden
  state, predicts which physical or viewpoint action can resolve it, and
  selects information actions by minimizing calibrated expected task risk.

milestones:
  piu_v0_end_to_end_smoke:
    status: GO
    evidence: results/smoke/piu_v0_full_pipeline_v4_seed1399.json
    scope: Non-paper disposable five-case information-loop smoke; DIRECT_ACT is a semantic handoff.
  t01_prompt_state_decision:
    status: GO
    evidence: results/t01_expected_risk_router_v1.json
    scope: One LIBERO layout family, ACT versus REMOVE_OCCLUDER.
  rss_method_ready:
    status: NOT_GO

gates:
  - id: RP0
    name: Frozen-policy reproduction
    blocking: true
    status: GO
    evidence: results/repro_libero_object.json
    pass_condition: Exact public pi05_libero wiring reproduces stock behavior.
    current: 100/100.

  - id: RP1
    name: Primitive capability before decision claims
    blocking: true
    status: GO
    evidence: results/capability/g5_executor_gate_stock_aligned_v2.json
    pass_condition: >-
      Every enabled action has a context-declared reliability lower bound at
      least 0.80; also report whether it passes the original 0.90 standard.
    current: >-
      ACT 100/100; T01 drawer-joint opening 97/100. The separate visual
      information-effect gate is RP3. Other actions remain disabled.

  - id: RP2
    name: Prompt-aligned typed belief
    blocking: true
    status: PARTIAL
    evidence: results/calibration/prompt_state_belief_t01_audit_100seed_v1.json
    pass_condition: >-
      Calibrated OBSERVED, VIEWPOINT_BLOCKED, MANIPULATION_ONLY, and ABSENT
      belief passes prompt, cause, and scene-disjoint counterfactuals.
    current: >-
      PIU V0 replaces the online two-state label with a target-location fact
      over visible workspace, middle drawer, other unsearched region, and
      absent. Only visible workspace and middle drawer have training data. Its
      old-seed diagnostic is 27/30; object-level maps, ABSENT, and scene-disjoint
      tests remain missing.

  - id: RP3
    name: Calibrated action-effect branches
    blocking: true
    status: NOT_GO
    evidence: results/smoke/piu_v0_full_pipeline_v4_seed1399.json
    pass_condition: >-
      Six-point RGB/proprioceptive critic recognizes FAILED, REVEALED, and EMPTY, while
      full-executor effect rates pass context-disjoint reliability gates.
    current: >-
      OPEN_AND_OBSERVE and a hierarchical six-frame critic are implemented.
      The v7 development result is invalid because its evaluator checked target
      visibility only in the final frame. Debug seed 770 saw the target during
      opening and lost it after return, which v7 would call EMPTY. The run was
      stopped at 77/300; 700-799 are debug-only. Temporal-label v3 then froze
      on 600-659, but v8 failed development: FAILED 7/7, REVEALED 7/9, EMPTY
      4/5. A five-pixel label mismatch motivated an architecture-derived
      256-pixel resolvability contract. V9 then passed critic gates on 660-699,
      but the physical EMPTY branch was 36/40 (lower 0.786), hence NOT-GO.
      V10 separates per-frame target temporal-OR from FAILED-vs-COMPLETED
      observation effect and is 120/120 only on the now-contaminated 660-699.
      Fresh 1400-1439 must pass before the sealed 900-999 audit. The physical
      lower bound is 0.80; conformal alpha is 0.05. The collector now
      separates the OffScreen controller from post-termination evaluator
      replay. Local seed-1399 disposable smoke passes REVEALED, EMPTY, and
      FAILED, and the PIU six-frame head predicts all five end-to-end smoke
      branches correctly. These are reused non-claim diagnostics.

  - id: RP4
    name: Expected-risk optimization
    blocking: true
    status: PARTIAL
    evidence: results/t01_expected_risk_router_v1.json
    pass_condition: >-
      ACT, information actions, and NOT_FOUND are selected from measured costs
      and effects, with no tuned confidence threshold and with preregistered sensitivity.
    current: >-
      Finite-horizon planner and cost sweep pass target-observability routing
      at 296/300. The minimal T01 runner bypasses probabilistic temporal q and
      applies hard action validity from deterministic control memory. Context-
      specific terminal ACT effects, multi-action history, and NOT_FOUND are
      not yet physically tested. PIU V0 additionally completes one disposable
      live sequence OPEN -> singleton outcome -> belief update -> replan using
      explicit EIG/task utility and the 0.924 OPEN reliability lower bound.

  - id: RP5
    name: Oracle-free history-dependent closed loop
    blocking: true
    status: PARTIAL
    evidence: results/audits/piu_v0_full_pipeline_v4_privileged_input_audit.json
    pass_condition: >-
      The deployed loop uses only policy RGB, prompt, action, and public history
      for routing, outcome recognition, stopping, retry, and belief update.
    current: >-
      Source/runtime guards and the five-case embodied smoke show zero online
      oracle inputs; evaluator scoring uses a separate environment or action
      replay after terminal. The learned heads are development/diagnostic only,
      so this is not clean validation.

  - id: RP6
    name: Decision benefit and ablations
    blocking: true
    status: PARTIAL
    evidence: results/t01_expected_risk_router_v1.json
    pass_condition: >-
      Beat monolithic, prompt-blind, action-spread, CoMe-style binary
      information-sufficiency, uncalibrated typed-belief, visual-only-history,
      no-history, and no-effect baselines on a frozen held-out paper test set.
    current: T01 beats three fixed rules; the paper test set and key ablations are missing.

  - id: RP7
    name: Active-perception breadth
    blocking: true
    status: NOT_GO
    evidence: null
    pass_condition: >-
      Demonstrate viewpoint discovery, manipulation discovery, and information
      enrichment with independently capable actions.
    current: Only manipulation discovery by middle-layer opening is certified.

  - id: RP8
    name: Final task benefit
    blocking: true
    status: NOT_GO
    evidence: results/t01_final_task_risk_readiness_v1.json
    pass_condition: Information acquisition improves final task success, not only target visibility.
    current: OPEN_CONTAINER then ACT is 0/5; direct open-drawer retrieval is 0/5.

  - id: RP9
    name: Held-out generalization
    blocking: true
    status: NOT_GO
    evidence: null
    pass_condition: >-
      Hold out objects, clutter, occlusion severity, containers, and scenes;
      reproduce the decision benefit with a second frozen policy.
    current: Only T01 pi05_libero is supported.

  - id: RP10
    name: Reproducible paper release
    blocking: true
    status: PARTIAL
    evidence: README.md
    pass_condition: >-
      One-command experiment, frozen hashes, automatic gate report, failure
      demos, concise README, and verified GPU shutdown.
    current: >-
      Immutable runners, hashes, and strict failure reports exist; the complete
      paper runner and final artifacts do not. The post-run GPU check found no
      project process; only the desktop service remained.

  - id: RP11
    name: Prompt-safe temporal task compliance
    blocking: true
    status: PARTIAL
    evidence: tests/test_temporal_belief.py
    pass_condition: >-
      A specification frozen before paper testing contains only generic task
      predicates, maintains a calibrated belief over finite-trace progress,
      and achieves a one-sided 95% lower bound of at least 0.90 for trajectory
      satisfaction without premature commit or false NOT_FOUND.
    current: >-
      An exact product-belief automaton, logic-risk term, and explicit
      SAFE_STOP branch are implemented and unit-tested. The proposition
      calibration, logic/deferral losses, deployed trace monitor, and held-out
      trajectory evidence are not yet frozen or measured.
