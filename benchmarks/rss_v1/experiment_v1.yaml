schema_version: interactive-perception.rss-experiment.v1
name: Prompt-aligned action-resolvable uncertainty
seed_registry: benchmarks/rss_v1/seed_registry.yaml
outcome_data_protocol: benchmarks/calibration/t01_open_and_observe_v12b.yaml

claim: >-
  A frozen VLA may possess an information action without knowing when it is
  useful. A calibrated wrapper chooses that action only when its expected
  reduction in prompt-relevant task risk exceeds its measured cost.

frozen_contract:
  policy: pi05_libero
  policy_weights: frozen
  policy_observation: [stock agentview RGB, stock wrist RGB, robot state, prompt]
  conformal_error_rate: 0.05
  confidence: 0.95
  minimum_action_reliability_lower_bound: 0.80
  original_strict_reliability_reported_also: 0.90
  minimum_resolvable_target_pixels: 256
  resolvability_derivation: (256 policy pixels / 16 visual tokens per side)^2
  forbidden_online: [segmentation, object pose, drawer joint, task predicate, demo global view]
  custom_scenario_scope: calibration_only

method_factorization:
  prompt_to_proposition:
    output: [OBSERVED, VIEWPOINT_BLOCKED, MANIPULATION_ONLY, ABSENT]
    note: The prompt names the final goal, never the benchmark-specific answer action.
  spatial_evidence:
    output: prompt-attended policy-camera tokens over six public history points
    inspiration: LERF-TOGO object-first then part/region-conditioned evidence
  action_candidates:
    output: capability-gated ACT and information options
    inspiration: TaskGrasp separates executable candidates from task-conditioned ranking
  action_effect_reasoning:
    output: [FAILED, REVEALED, EMPTY]
    label_rule: REVEALED at any public history point; EMPTY requires independent view-coverage evidence.
    inspiration: ShapeGrasp separates grounded part/state identification from task utility
  decision:
    output: ACT, information option, NOT_FOUND, or SAFE_STOP
    rule: >-
      Current T01 uses finite-horizon expected risk on the two-state world
      belief with hard-valid actions from deterministic control memory. The
      probabilistic temporal-progress belief is bypassed.

minimal_t01_control:
  world_state: [OBSERVED, MANIPULATION_ONLY]
  deterministic_memory: [phase, searched_set, attempt_counts]
  phases: [IDLE, AWAITING_EFFECT, COMMITTING, DONE]
  action_legality: hard A_valid(memory) filter before risk planning
  probabilistic_temporal_progress_used: false
  empty_rule: local middle-layer exclusion only; never global NOT_FOUND

t01_development:
  action: OPEN_AND_OBSERVE
  regimes: [revealed_full, empty_full, failed_truncated_control]
  seeds:
    prototype_train: 600-619
    conformal_calibration: 620-652
    heldout_development: 653-659
  samples_per_regime: 60
  history:
    points: 6
    layout: [before, open_25, open_50, open_75, open_100, after_return]
    inputs_per_point: [agentview RGB, wrist RGB, public robot state]
  pass_conditions:
    - REVEALED full-option one-sided lower bound >= 0.80.
    - EMPTY full-option one-sided lower bound >= 0.80.
    - Every outcome class has development coverage >= 0.90.
    - Every outcome class has development singleton accuracy >= 0.80.
  frozen_result:
    status: NOT_GO
    physical_revealed: 60/60; lower 0.951
    physical_empty_under_v3_five_pixel_label: 56/60; lower 0.854
    critic: {FAILED: 7/7, REVEALED: 7/9, EMPTY: 4/5}

t01_v9_clean_extension:
  seeds: 660-699
  purpose: >-
    Untouched development after v8 diagnosis and the architecture-derived
    resolvability correction. Seeds 653-659 are diagnostic-only for v9.
  selected_input: visual-only six-point temporal history
  selection_rule: tied full temporal history at 0.95 grouped content CV and uses fewer inputs
  pass_conditions:
    - Every outcome class has coverage >= 0.90.
    - Every outcome class has singleton accuracy >= 0.80.
    - Both full physical branches have one-sided lower bound >= 0.80.
  result: NOT_GO
  provenance: consumed; subsequently contaminated by v10 diagnosis

t01_v10_clean_development:
  seeds: 1400-1439
  purpose: >-
    Fresh development for the frozen v10 composite: per-frame agentview target
    evidence with temporal OR, followed only when target evidence is absent by
    a FAILED-vs-COMPLETED observation-effect head.
  selected_target_input: six stock agentview RGB frames
  selected_effect_input: visual-only six-point pi0.5 history features
  pass_conditions:
    - Every outcome class has correct-label retention >= 0.90.
    - Every outcome class has singleton-correct one-sided 95% lower bound >= 0.80.
    - False singleton EMPTY equals zero.
    - False singleton REVEALED equals zero.
    - REVEALED and local EMPTY information-acquisition lower bounds are each >= 0.80.
  result:
    status: NOT_GO
    samples: 120
    correct_singletons: 118
    blocker: one false singleton EMPTY on seed 1420
  provenance: consumed; subsequently used for v11 model selection

t01_v11_clean_development:
  seeds: 1440-1479
  status: consumed_not_go_then_v12b_model_selection
  purpose: >-
    Fresh development for the frozen all-public-RGB v11 cascade: agentview
    target evidence, wrist positive-only target rescue, and independent
    agentview coverage evidence.
  selected_inputs: six stock agentview RGB frames and six stock wrist RGB frames
  priority: >-
    Secondary to first stabilizing the canonical same-state executable loop,
    because frozen pi05_libero is itself cross-seed variable.
  pass_conditions:
    - Every outcome class has correct-label retention >= 0.90.
    - Every outcome class has singleton-correct one-sided 95% lower bound >= 0.80.
    - False singleton EMPTY equals zero.
    - False singleton REVEALED equals zero.
    - REVEALED and local EMPTY information-acquisition lower bounds are each >= 0.80.
  result:
    status: NOT_GO
    samples: 120
    correct_singletons: 118
    blockers:
      - false singleton REVEALED on seed 1455
      - false singleton REVEALED on seed 1464
  provenance: >-
    Consumed by the failed v11 clean run and subsequently used to select the
    v12/v12b composition rule; no longer claim-bearing.

t01_v12_first_composition:
  status: retired_before_fresh_data
  evidence: results/calibration/t01_open_and_observe_v12_model_selection_decision.json
  reason: >-
    Treating every wrist prediction set containing REVEALED as counterevidence
    was overly conservative. It was retired without opening fresh or sealed
    data.

t01_v12b_clean_development:
  seeds: 1900-1939
  status: GO
  purpose: >-
    Fresh development for the frozen v12b public-RGB composition. Only a
    singleton wrist-positive versus singleton agentview-negative conflict is
    preserved as ambiguity/SAFE_STOP; a multi-label wrist set is abstention.
  selected_inputs: six stock agentview RGB frames and six stock wrist RGB frames
  samples: 120
  result:
    FAILED: {coverage: 40/40, singleton: 40/40, lower: 0.927842}
    REVEALED: {coverage: 40/40, singleton: 40/40, lower: 0.927842}
    EMPTY: {coverage: 40/40, singleton: 39/40, lower: 0.886812}
    false_singleton_EMPTY: 0
    false_singleton_REVEALED: 0
    mean_prediction_set_size: 1.008333
    ambiguous_safe_stop: 1/120
    physical_REVEALED: {success: 40/40, lower: 0.927842, passes_original_0.90: true}
    physical_EMPTY: {success: 40/40, lower: 0.927842, passes_original_0.90: true}
    six_frame_vs_final_only_REVEALED: 40/40 vs 38/40
    controller_online_oracle_reads: 0
  evidence: results/calibration/t01_open_and_observe_clean_development_v12b.json
  provenance: consumed_go_immutable

t01_sealed_audit:
  seeds: 900-999
  collection_rule: >-
    Collected exactly once after v12b passed fresh seeds 1900-1939 and the
    frozen authorization hash verified immediately before collection.
  samples_per_regime: 100
  pass_conditions:
    - Per-class conformal coverage >= 0.90.
    - Per-class singleton-correct one-sided lower bound >= 0.80.
    - REVEALED and EMPTY physical-effect lower bounds >= 0.80.
  reporting_rule: Also report whether each branch passes the original 0.90 standard.
  result:
    status: GO
    samples: 300
    FAILED: {coverage: 100/100, singleton: 100/100, lower: 0.970487}
    REVEALED: {coverage: 100/100, singleton: 100/100, lower: 0.970487}
    EMPTY: {coverage: 99/100, singleton: 94/100, lower: 0.885015}
    false_singleton_EMPTY: 0
    false_singleton_REVEALED: 0
    mean_prediction_set_size: 1.016667
    ambiguous_safe_stop: 5/300
    physical_REVEALED: {success: 100/100, lower: 0.970487, passes_original_0.90: true}
    physical_EMPTY: {success: 100/100, lower: 0.970487, passes_original_0.90: true}
    six_frame_vs_final_only_REVEALED: 100/100 vs 96/100
    controller_online_oracle_reads: 0
    motor_return_completion: 199/200
    motor_return_note: >-
      Seed 938 EMPTY was visually certified despite a timed-out return; do not
      report this information endpoint as 200/200 actuator completion.
  evidence: results/calibration/t01_open_and_observe_sealed_audit_v12b.json
  provenance: consumed_go_immutable

closed_loop_test:
  seeds: 800-899
  prerequisite: The sealed action-effect/outcome audit passes.
  objective: target observability; final task completion is reported separately
  eligibility: held-out custom-scenario pipeline validation; not paper-eligible
  primary_metrics:
    - correct terminal decision
    - physical information acquired
    - false ACT
    - false NOT_FOUND
    - SAFE_STOP
    - interaction cost
    - temporal-logic violation
    - action-resolvable uncertainty before and after the option
    - evidence-retention accuracy when the target was seen in history but absent from the final frame

paper_stages:
  mechanism:
    status: outcome_clean_and_sealed_go_behavior_loop_demonstrated
    question: Does calibrated prompt-aligned uncertainty improve target-observability decisions?
    benchmark: T01 stock-aligned middle-layer search
    test_seeds: 800-899
    paper_eligible: false
    engineering_priority: canonical same-state full-loop stability before broad executor robustness
  breadth:
    status: blocked_by_primitive_capability
    question: Does the same decision rule transfer across uncertainty causes and information actions?
    strata:
      viewpoint_discovery: wrist MOVE_CLOSER
      manipulation_discovery: OPEN_AND_OBSERVE and physical occluder removal
      information_enrichment: grasp-ROTATE-put-down
      exhaustion: multi-container NOT_FOUND
    rule: Each option gets a disjoint calibration set and passes its own 0.80 action lower bound before use.
  final_task:
    status: blocked_by_post_reveal_act
    question: Does information acquisition improve completion of the user's original task?
    rule: Report paired final-task success; target visibility is not a substitute.
    latest_diagnostic: >-
      One disposable original-prompt physical continuation acquired information
      but failed the final task (information 1/1, final task 0/1). Historical
      oracle-switched two-stage retrieval remains 0/5 under a different protocol.
  generalization:
    status: blocked
    held_out_axes: [object, clutter, occlusion_severity, container, scene, base_policy]
    rule: Freeze these splits only after all enabled options pass capability and effect audits.
  final_paper_test:
    status: not_frozen
    requirement: >-
      Use a benchmark protocol authorized for paper evaluation; custom scenarios
      introduced in this project remain calibration-only.

methods:
  - monolithic_vla
  - fixed_action_order
  - action_chunk_spread
  - come_style_binary_sufficiency
  - uncalibrated_typed_belief
  - no_history
  - no_return_to_observe
  - visual_only_history
  - global_pooling_only
  - flat_outcome_critic
  - no_effect_model
  - no_temporal_progress
  - full_method

statistics:
  pairing: Same initial states, policy call order, option executor, and observation contract across methods.
  uncertainty: Exact binomial intervals for gates; paired bootstrap and McNemar test for method differences.
  reporting: Report all seeds and failures; PARTIAL is NOT-GO.

hard_stop_rules:
  - Never open the sealed audit when development fails.
  - Never call joint motion visual information acquisition.
  - Never enable an option whose context-specific reliability lower bound is below 0.80.
  - Never report final-task benefit while post-reveal ACT remains incapable.
  - Never infer EMPTY from a target-free final frame without a searched-volume coverage certificate.
  - Always stop project-owned model servers after every stage.
