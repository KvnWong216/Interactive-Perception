schema_version: interactive-perception.rss-ablations.v1
name: Frozen paper ablations for prompt-aligned action-resolvable uncertainty

fairness_contract:
  - Use the same frozen base policy, observations, prompts, option executors, and paper test episodes.
  - Select models and thresholds on calibration data only; never tune on the paper test set.
  - Report target observability and final task success separately.
  - Report action use, action failure, false commit, false NOT_FOUND, and total interaction cost.

methods:
  - id: monolithic_vla
    description: Execute the final task prompt with the frozen VLA and no router.

  - id: fixed_rule
    description: Use a scene-state-independent hand-written action order.

  - id: action_spread
    description: Route from repeated action-chunk geometric or semantic spread.

  - id: come_style_binary_sufficiency
    description: >-
      A literature-inspired binary cognitive head predicts whether information
      is sufficient, then switches between exploration and exploitation. It has
      no typed cause, action-effect distribution, or action cost. This is not a
      reproduction of CoMe-VLA.
    threshold_rule: Freeze on calibration only; also report the published CoMe-VLA deployment rule tau=0.7.
    temporal_rule: Require three consecutive positive frames when a temporal episode is available.

  - id: uncalibrated_typed_belief
    description: Use the same typed head but take argmax without a conformal set.

  - id: visual_only_history
    description: Keep before/after visual features but remove executed-action and proprioceptive history.

  - id: no_history
    description: Judge the outcome from the final frame only.

  - id: no_return_to_observe
    description: >-
      Stop after the frozen VLA opening option. This tests whether temporal
      evidence alone is enough for REVEALED and whether viewpoint recovery is
      still needed to certify EMPTY.

  - id: global_pooling_only
    description: >-
      Remove prompt-attended spatial tokens and retain only globally pooled
      prefix features. This tests whether prompt-to-region grounding matters.

  - id: flat_outcome_critic
    description: >-
      Predict FAILED, REVEALED, and EMPTY with one three-way head instead of
      separating physical completion from prompt-relevant observed content.

  - id: no_effect_model
    description: Assume every enabled information action succeeds with probability one.

  - id: no_temporal_progress
    description: >-
      Remove the finite-trace progress belief. Decisions use only the current
      target-state belief, so premature commit, repeated exploration, and
      unjustified NOT_FOUND are not independently represented.

  - id: hard_progress_automaton
    description: >-
      Collapse the progress belief to its most likely automaton state before
      planning. This tests whether retaining uncertainty over task progress
      matters beyond adding a hand-written state machine.

  - id: tleaf_style_temporal_embedding
    description: >-
      Optional data-efficiency arm: train a DFA/trace embedding loss from
      satisfying and violating trajectories. It is not part of the required
      frozen-policy method and runs only after physical action effects pass.

  - id: scalar_uncertainty_threshold
    description: Trigger exploration from entropy alone using a calibration-selected threshold.

  - id: full_method
    description: >-
      Typed conformal belief, context-scoped action effects, explicit public
      history, probabilistic finite-trace progress, and Bayes-risk planning with
      action-resolvable uncertainty.

required_strata:
  target_state: [OBSERVED, VIEWPOINT_BLOCKED, MANIPULATION_ONLY, ABSENT]
  active_perception_type: [VIEWPOINT_DISCOVERY, MANIPULATION_DISCOVERY, INFORMATION_ENRICHMENT]
  held_out_axis: [object, clutter, occlusion_severity, container, scene]

primary_comparisons:
  - full_method vs monolithic_vla tests whether routing helps.
  - full_method vs come_style_binary_sufficiency tests whether typed causes, effects, and costs matter.
  - full_method vs uncalibrated_typed_belief tests whether conformalization matters.
  - full_method vs visual_only_history and no_history tests whether action-conditioned memory matters.
  - full_method vs no_return_to_observe tests the value of explicit viewpoint recovery.
  - full_method vs global_pooling_only tests whether prompt-conditioned spatial grounding matters.
  - full_method vs flat_outcome_critic tests whether effect/content factorization matters.
  - full_method vs no_effect_model tests whether physical reliability calibration matters.
  - full_method vs no_temporal_progress tests whether sequence structure prevents premature commit and false NOT_FOUND.
  - full_method vs hard_progress_automaton tests whether progress uncertainty matters beyond a deterministic state machine.
