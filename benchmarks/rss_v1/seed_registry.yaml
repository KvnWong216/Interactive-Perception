schema_version: interactive-perception.seed-registry.v1
repository_commit: b14fc9a4218f941e849cb74ca4edbc3454bdd802
authority: benchmarks/rss_v1/seed_registry.yaml
scope: T01 claim-bearing, diagnostic, validation, audit, and disposable-smoke blocks
decision_rule: >-
  A seed belongs to exactly one block below. Disposable smoke seeds never
  support a scientific claim. Debugged or partially opened blocks are
  quarantined in full and are never promoted back to validation or audit.

blocks:
  - id: t01_legacy_router_test
    seeds: 90-189
    role: historical_routing_test
    status: consumed
    evidence: results/capability/t01_conformal_reveal_100seed_v1.json
    note: Legacy success field is drawer-joint opening, not RGB target reveal.

  - id: t01_prompt_state_prototype_train
    seeds: 220-239
    role: prompt_state_prototype_train
    status: consumed
    evidence: data/calibration/t01_prompt_state_v1.manifest.json

  - id: t01_prompt_state_conformal_calibration
    seeds: 240-259
    role: prompt_state_conformal_calibration
    status: consumed
    evidence: data/calibration/t01_prompt_state_v1.manifest.json

  - id: t01_prompt_state_heldout_development
    seeds: 260-269
    role: prompt_state_heldout_development
    status: consumed
    evidence: data/calibration/t01_prompt_state_v1.manifest.json

  - id: t01_prompt_state_audit
    seeds: 280-309
    role: prompt_state_audit
    status: consumed
    evidence: data/calibration/t01_prompt_state_v1_audit.manifest.json

  - id: t01_prompt_state_audit_extension
    seeds: 310-379
    role: prompt_state_audit_extension
    status: consumed
    evidence: data/calibration/t01_prompt_state_v1_audit_extension.manifest.json

  - id: t01_action_effect_development
    seeds: 400-459
    role: development
    status: consumed
    evidence: data/calibration/t01_action_effect_v1.manifest.json

  - id: t01_legacy_action_effect_audit
    seeds: 500-599
    role: legacy_quarantine
    status: never_use_for_current_protocol
    note: >-
      Reserved by the obsolete v1 action-effect protocol. It is not the v9
      sealed audit and is quarantined to prevent accidental reassignment.

  - id: t01_open_observe_prototype_train
    seeds: 600-619
    role: prototype_train
    status: consumed
    evidence: data/calibration/t01_open_and_observe_effect_v3.manifest.json

  - id: t01_open_observe_conformal_calibration
    seeds: 620-652
    role: conformal_calibration
    status: consumed
    evidence: data/calibration/t01_open_and_observe_effect_v3.manifest.json

  - id: t01_open_observe_v8_v9_diagnostic
    seeds: 653-659
    role: diagnostic_only
    status: consumed_and_contaminated
    evidence: results/T01_OUTCOME_V8_V9_DIAGNOSTIC.md

  - id: t01_open_observe_clean_extension
    seeds: 660-699
    role: v9_clean_development
    status: consumed_not_go_then_v10_diagnostic
    evidence: results/calibration/t01_open_and_observe_clean_extension_v9.json
    note: >-
      V9 was NOT-GO because EMPTY physical completion was 36/40. Subsequent
      inspection and v10 model selection contaminated the whole block; it is
      retained only as a reproducible non-claim diagnostic.

  - id: t01_open_observe_final_frame_debug
    seeds: 700-799
    role: debug_only
    status: quarantined
    evidence: data/calibration/t01_open_and_observe_effect_v1_audit.jsonl
    note: >-
      Seeds 700-776 were collected before the temporal-label bug was found.
      The entire 700-799 block is quarantined; 777-799 are not reassigned.

  - id: t01_closed_loop_validation
    seeds: 800-899
    role: frozen_pipeline_validation
    status: untouched
    paper_eligible: false
    open_condition: sealed outcome audit passes

  - id: t01_open_observe_sealed_audit
    seeds: 900-999
    role: sealed_audit
    status: consumed_go
    paper_eligible: true
    evidence:
      - results/calibration/t01_open_and_observe_v12b_sealed_authorization.json
      - results/calibration/t01_open_and_observe_sealed_audit_v12b.json
    note: >-
      Collected exactly once after the v12b clean-development GO and frozen
      authorization hash verification. Every preregistered sealed outcome gate
      passed; this block is immutable and cannot be used for model selection.

  - id: t01_closed_loop_smoke
    seeds: [1300]
    role: disposable_smoke
    status: available
    paper_eligible: false

  - id: t01_open_observe_smoke
    seeds: [1399]
    role: disposable_smoke
    status: reusable_nonclaim
    evidence:
      - data/calibration/t01_open_and_observe_effect_v4_smoke.manifest.json
      - results/smoke/piu_v0_end_to_end_v3_seed1399.json
      - results/smoke/piu_v0_full_pipeline_v4_seed1399.json
    paper_eligible: false

  - id: t01_open_observe_v10_clean_development
    seeds: 1400-1439
    role: v10_clean_development
    status: consumed_not_go_then_v11_model_selection
    paper_eligible: false
    evidence: results/calibration/t01_open_and_observe_clean_development_v10.json
    note: >-
      V10 failed the zero-false-EMPTY gate on wrist-only reveal seed 1420. The
      full block was then used to design v11 and cannot be reused for claims.

  - id: t01_open_observe_v11_clean_development
    seeds: 1440-1479
    role: frozen_clean_development
    status: consumed_not_go_then_v12b_model_selection
    paper_eligible: false
    evidence:
      - results/calibration/t01_open_and_observe_clean_development_v11.json
      - results/calibration/t01_open_and_observe_v12b_model_selection_on_v11.json
    note: >-
      V11 failed because seeds 1455 and 1464 emitted false singleton REVEALED.
      The whole block was subsequently used to select the v12/v12b composition
      rule and cannot support a clean or sealed claim.

  - id: piu_counterfactual_prototype_train
    seeds: 1500-1519
    role: piu_prototype_train
    status: consumed_training
    evidence: data/piu_v1/prototype_train_v3.manifest.json

  - id: piu_counterfactual_prototype_train_reserve
    seeds: 1520-1599
    role: piu_prototype_train_reserve
    status: untouched

  - id: piu_counterfactual_conformal_calibration
    seeds: 1600-1619
    role: piu_conformal_calibration
    status: consumed_calibration
    evidence: data/piu_v1/conformal_calibration_v3.manifest.json

  - id: piu_counterfactual_conformal_calibration_reserve
    seeds: 1620-1699
    role: piu_conformal_calibration_reserve
    status: untouched

  - id: piu_scene_disjoint_clean_development_invalid_v1
    seeds: 1700-1719
    role: piu_clean_development_invalid_protocol
    status: consumed_not_go
    paper_eligible: false
    evidence: results/calibration/piu_v1_clean_attempt_v1_not_go.json
    note: >-
      Collection aborted on the first seed because the registered hidden black
      bowl had 1273 agentview pixels and violated the frozen visibility contract.
      No model inference or clean dataset was produced; the full preregistered
      range is nevertheless retired.

  - id: piu_scene_disjoint_clean_development
    seeds: 1720-1739
    role: piu_v1_replacement_clean_development
    status: consumed_not_go_then_v2_training
    paper_eligible: false
    evidence: results/calibration/piu_object_sidecar_clean_v1.json
    note: >-
      V1 failed visible-workspace generalization and node-relevance gates. The
      full split was then added to V2 development training and cannot be reused.

  - id: piu_scene_disjoint_clean_development_v2
    seeds: 1740-1759
    role: piu_v2_clean_development
    status: authorized_unopened
    open_condition: V2 authorization verifies model 130a6705 and four disposable visibility preflights

  - id: piu_scene_disjoint_clean_development_reserve
    seeds: 1760-1799
    role: piu_clean_development_reserve
    status: untouched

  - id: piu_scene_disjoint_sealed_audit
    seeds: 1800-1899
    role: future_piu_sealed_audit
    status: sealed
    open_condition: PIU clean scene-disjoint development passes every preregistered gate

  - id: t01_open_observe_v12b_clean_development
    seeds: 1900-1939
    role: frozen_clean_development
    status: consumed_go
    paper_eligible: true
    evidence: results/calibration/t01_open_and_observe_clean_development_v12b.json
    note: >-
      All preregistered v12b clean gates passed. This block is immutable and
      cannot be used for any further model, rule, or threshold selection.

forbidden_transitions:
  - disposable_smoke -> development
  - debug_only -> development
  - debug_only -> sealed_audit
  - frozen_pipeline_validation -> model_or_threshold_selection
  - sealed_audit -> model_or_threshold_selection
