schema_version: interaction-uncertainty.piu-scene-disjoint-protocol.v1
status: frozen_before_first_v2_clean_inference
primary_endpoint: prompt_conditioned_target_location_and_action_selection
online_inputs: [agentview RGB, wrist RGB, public robot state, full prompt]
online_forbidden:
  - segmentation
  - simulator depth
  - hidden object pose
  - articulated joint state
  - task predicate
  - semantic instance ID
  - global camera
frontend:
  grounding: IDEA-Research/grounding-dino-tiny
  segmentation: facebook/sam-vit-base
  region_features: facebook/dinov2-small
  box_threshold: 0.30
  text_threshold: 0.20
  nms_iou: 0.70
  dense_sam_grid: 16
  dense_sam_min_iou: 0.80
  max_dense_proposals_per_view: 32
  generic_container_queries: [drawer, cabinet, refrigerator, fridge, refrigerator door, mini refrigerator, container]
  policy_query_contract: prompt entities plus frozen generic vocabulary only
model:
  path: results/models/piu_object_sidecar_v2.pt
  sha256: 130a6705d6b435fdfe370f6cc60665410e9c7284ee2b833ae3856c598251bc84
  training_rows: 180
  calibration_rows: 80
  development_change: >-
    V1 clean was consumed as development data after NOT-GO. No new state,
    action, planner, threshold family, or online signal was introduced.
task_state_domain:
  target_location: [visible_workspace, closed_container]
  preferred_action: [DIRECT_ACT, OPEN_TO_INSPECT]
label_contract:
  prompt_resolvable: at least 256 target pixels in either stock policy camera
  contradiction_rule: abort collection
provenance_scenario_paths:
  train:
    - scenarios/t01_stock_ladder_v1/T01D_hidden_butter_retrieval.bddl
    - scenarios/t01_stock_ladder_v1/T01E_open_drawer_retrieval.bddl
    - scenarios/interactive_manipulation_v0/T02_fridge_retrieval.bddl
    - third_party/LIBERO/libero/libero/bddl_files/libero_object/pick_up_the_butter_and_place_it_in_the_basket.bddl
    - scenarios/t01_stock_ladder_v1/T01C_hidden_butter_basket.bddl
    - third_party/LIBERO/libero/libero/bddl_files/libero_object/pick_up_the_milk_and_place_it_in_the_basket.bddl
    - third_party/LIBERO/libero/libero/bddl_files/libero_object/pick_up_the_salad_dressing_and_place_it_in_the_basket.bddl
    - scenarios/interactive_manipulation_v0/T05_exhaustive_not_found.bddl
  calibration:
    - scenarios/interactive_manipulation_v0/T01_multi_drawer_search.bddl
    - third_party/LIBERO/libero/libero/bddl_files/libero_object/pick_up_the_ketchup_and_place_it_in_the_basket.bddl
    - scenarios/t01_stock_ladder_v1/T01B_hidden_butter.bddl
    - third_party/LIBERO/libero/libero/bddl_files/libero_object/pick_up_the_chocolate_pudding_and_place_it_in_the_basket.bddl
splits:
  clean_scene_disjoint_development:
    seed_block: piu_scene_disjoint_clean_development_v2
    seeds: 1740-1759
    open_now: false
    open_condition: V2 clean authorization verifies every frozen dependency
    scenarios:
      - id: v2_clean_visible_orange_juice
        bddl: third_party/LIBERO/libero/libero/bddl_files/libero_object/pick_up_the_orange_juice_and_place_it_in_the_basket.bddl
        prompt: Pick up the orange juice and place it in the basket
        target: orange juice
        destination: basket
        target_instance: orange_juice_1
        target_location: visible_workspace
        preferred_action: DIRECT_ACT
      - id: v2_clean_visible_tomato_sauce
        bddl: third_party/LIBERO/libero/libero/bddl_files/libero_object/pick_up_the_tomato_sauce_and_place_it_in_the_basket.bddl
        prompt: Pick up the tomato sauce and place it in the basket
        target: tomato sauce
        destination: basket
        target_instance: tomato_sauce_1
        target_location: visible_workspace
        preferred_action: DIRECT_ACT
      - id: v2_clean_fridge_hidden_bbq_sauce
        bddl: scenarios/piu_v2/T08_fridge_hidden_bbq_sauce.bddl
        prompt: Place the bbq sauce in the wicker basket
        target: bbq sauce
        destination: wicker basket
        target_instance: bbq_sauce_1
        target_location: closed_container
        preferred_action: OPEN_TO_INSPECT
        interaction_target: short refrigerator
      - id: v2_clean_bottom_drawer_hidden_butter
        bddl: scenarios/piu_v2/T09_bottom_drawer_hidden_butter.bddl
        prompt: Place the butter in the basket
        target: butter
        destination: basket
        target_instance: butter_1
        target_location: closed_container
        preferred_action: OPEN_TO_INSPECT
        interaction_target: bottom drawer
sealed:
  seed_block: piu_scene_disjoint_sealed_audit
  seeds: 1800-1899
  status: unopened
  open_condition: every V2 clean gate passes without model changes
