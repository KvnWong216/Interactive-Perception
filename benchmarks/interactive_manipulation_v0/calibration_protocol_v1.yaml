name: libero-semantic-intent-calibration-v1
frozen: true
policy: pi05_libero
scope: [ACT, REMOVE_OCCLUDER]
conformal_error_rate: 0.10
target_marginal_coverage: 0.90
minimum_executor_reliability: 0.90
samples: 100
chunks_per_observation: 8
split:
  prototype_train: {seeds: [0, 19], per_class: 20}
  conformal_calibration: {seeds: [20, 39], per_class: 20}
  heldout_validation: {seeds: [40, 49], per_class: 10}
data_policy:
  calibration_scenarios_may_enter_paper_test_set: false
  calibration_samples_may_enter_paper_test_set: false
  simulator_segmentation_allowed: false
  simulator_object_pose_allowed: false
  hidden_target_anchor_allowed: false
notes:
  - G4-v1 covers only ACT versus REMOVE_OCCLUDER.
  - NOT_FOUND, ROTATE, and MOVE_CLOSER remain uncalibrated.
  - Conformal coverage does not imply physical execution success.
