name: Stock-Aligned-Interactive-Perception-v1
version: 1.0.0
principle: >-
  Preserve a pi0.5 LIBERO training task and change exactly one causal factor.
  T04 is the unmodified source task. T06 changes only the milk placement so it
  occludes the ketchup in both policy cameras.

backend:
  policy_primary_camera: agentview
  policy_wrist_camera: robot0_eye_in_hand
  demo_camera: agentview
  demo_camera_pose:
    position: [0.0, 0.0, 2.40]
    quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
  demo_labels: [FIRST-PERSON / WRIST, THIRD-PERSON / GLOBAL]

tasks:
  - id: T04_stock_visible_ketchup
    family: visible_control
    bddl: third_party/LIBERO/libero/libero/bddl_files/libero_object/pick_up_the_ketchup_and_place_it_in_the_basket.bddl
    prompt_variants:
      implicit: Pick the ketchup and place it in the basket
      hinted: Pick the ketchup and place it in the basket
      explicit: Pick the ketchup and place it in the basket
      capability: Pick the ketchup and place it in the basket

  - id: T06_single_occluder_ketchup
    family: removable_occlusion
    bddl: scenarios/stock_aligned_v1/T06_occluded_ketchup.bddl
    target: ketchup_1
    occluder: milk_1
    source_task: libero_object[4]
    only_intervention: milk placement
    information_endpoint:
      type: object_displacement
      objects:
        - {name: milk_1, minimum_m: 0.05}
    prompt_variants:
      implicit: Pick the ketchup and place it in the basket
      hinted: Pick the ketchup and place it in the basket. The ketchup may be blocked by another object.
      explicit: Move the milk away, then pick the ketchup and place it in the basket.
      capability: Move the milk away from the ketchup.

  - id: T06_dual_camera_occluded_ketchup
    family: severe_removable_occlusion
    bddl: scenarios/stock_aligned_v1/T06_dual_camera_occluded_ketchup.bddl
    target: ketchup_1
    occluders: [milk_1, salad_dressing_1]
    source_task: libero_object[4]
    only_intervention: two existing distractor placements and fixed target coordinate within its original region
    information_endpoint:
      type: object_displacement
      objects:
        - {name: milk_1, minimum_m: 0.05}
        - {name: salad_dressing_1, minimum_m: 0.05}
    prompt_variants:
      implicit: Pick the ketchup and place it in the basket
      hinted: Pick the ketchup and place it in the basket. It may be blocked by nearby objects.
      explicit: Move the milk and salad dressing away, then pick the ketchup and place it in the basket.
      capability: Move the milk and salad dressing away from the ketchup.
