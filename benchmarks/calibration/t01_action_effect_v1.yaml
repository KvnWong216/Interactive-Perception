schema_version: interactive-perception.action-effect-protocol.v1
calibration_only: true
policy: pi05_libero
policy_rng_contract:
  initialization: openpi Policy default jax.random.key(0)
  infer_calls_before_collection: 0
  sample_order: regime order, ascending seed, online replan order
  resume_contract: fresh server plus exact skipped-infer-call replay
action: REMOVE_OCCLUDER
executor_prompt: Open the middle layer of the drawer
final_prompt: Place the butter in the basket
policy_inputs: [stock agentview RGB, stock wrist RGB, robot state, prompt]
online_forbidden_inputs: [drawer joint, instance segmentation, hidden target pose, task predicate]
evaluator_only_labels: [drawer joint, target instance pixels, frozen target location]

outcomes:
  REVEALED: The target occupies at least 5 pixels in one policy camera after the middle layer opens.
  EMPTY: >-
    The middle layer opens, the frozen scene construction places the target
    elsewhere, and the seed-matched target-present counterpart reaches
    REVEALED. This conservatively certifies that the action/view can expose the
    searched volume instead of using simulator absence alone.
  FAILED: The action does not produce prompt-relevant visual information.

evaluator_only_failure_subtypes:
  NO_EFFECT: The middle layer did not open.
  OPENED_UNOBSERVED: The layer opened but the target remained below the five-pixel visibility endpoint.
subtype_policy: >-
  Subtypes are reported for diagnosis and next-action design, but remain one
  FAILED critic class in v1 because the rare subtype is not large enough for an
  independent class-conditional conformal calibration.

empty_visibility_limitation: >-
  The seed-paired counterfactual is a calibration-only proxy. A paper-scale
  implementation should replace it with observed depth-based visible/occluded
  volume or a learned geometry-grounded visibility certificate.

regimes:
  - id: revealed_full
    bddl: scenarios/t01_stock_ladder_v1/T01D_hidden_butter_retrieval.bddl
    executor_steps: 300
    intended_outcome: REVEALED
  - id: empty_full
    bddl: scenarios/t01_stock_ladder_v1/T01F_middle_drawer_empty_calibration.bddl
    executor_steps: 300
    intended_outcome: EMPTY
  - id: failed_truncated_control
    bddl: scenarios/t01_stock_ladder_v1/T01D_hidden_butter_retrieval.bddl
    executor_steps: 25
    intended_outcome: FAILED
    limitation: This balances the visual critic; it does not estimate full-executor failure frequency.

development_seeds: 400-459
future_audit_seeds: 500-599
conformal_error_rate: 0.10
confidence: 0.95
minimum_reliability_lower_bound: 0.90
minimum_revealed_target_pixels: 5

gates:
  - Every class has at least 60 development examples before fitting.
  - The artifact is frozen before seeds 500-599 are collected.
  - Class-conditional coverage and singleton-correct lower bounds are at least 0.90.
  - Full-executor REVEALED and EMPTY reliability are reported separately from critic accuracy.
  - Truncated controls may train the FAILED recognizer but cannot authorize an executor.
