schema_version: interactive-perception.open-and-observe-protocol.v3
calibration_only: true
policy: pi05_libero
action: OPEN_AND_OBSERVE
context: t01_stock_middle_drawer_search

evidence_contract:
  history_points: [before, open_25, open_50, open_75, open_100, after_return]
  policy_inputs: [agentview RGB, wrist RGB, prompt]
  target_resolvable_pixels: 256
  derivation: (256 policy pixels / 16 visual tokens per side)^2
  EMPTY_requires:
    - no resolvable target at any history point
    - searched layer open
    - return-to-observe complete
    - same-camera-pose counterfactual visibility coverage

split_contract:
  v8_diagnostic_only: 653-659
  clean_development_extension: 660-699
  sealed_audit: 900-999
  custom_scenario_scope: calibration_only

statistics:
  conformal_error_rate: 0.10
  confidence: 0.95
  minimum_action_reliability_lower_bound: 0.80
  report_original_action_bound_also: 0.90

hard_stops:
  - Never use evaluator joints, segmentation, or target poses online.
  - Never treat sub-token target leakage as prompt-resolvable evidence.
  - Never open the sealed audit until the clean extension passes.
  - Ambiguous outcomes stop instead of being collapsed by another threshold.
