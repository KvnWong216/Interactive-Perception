schema_version: interactive-perception.open-and-observe-protocol.v10
calibration_only: true
policy: pi05_libero
action: OPEN_AND_OBSERVE
context: t01_stock_middle_drawer_search
seed_registry: benchmarks/rss_v1/seed_registry.yaml

evidence_contract:
  history_points: [before, open_25, open_50, open_75, open_100, after_return]
  target_evidence_online_inputs: [agentview RGB, target query]
  observation_effect_online_inputs:
    - agentview RGB
    - wrist RGB
    - public robot state
    - action role
    - public action history
  target_resolvable_pixels: 256
  target_derivation: (256 policy pixels / 16 visual tokens per side)^2
  temporal_persistence: target evidence at any history point cannot be erased later
  EMPTY_requires:
    - singleton NOT_REVEALED from the target-evidence head
    - singleton COMPLETED from the observation-effect head
    - evaluator scoring confirms same-camera searched-region coverage at some history point
  FAILED_requires:
    - singleton NOT_REVEALED from the target-evidence head
    - singleton FAILED from the observation-effect head
  ambiguity: preserve the conformal set and SAFE_STOP

split_contract:
  model_selection_only: 600-699
  v9_not_go: 660-699
  fresh_v10_clean_development: 1400-1439
  sealed_audit: 900-999
  custom_scenario_scope: calibration_only

statistics:
  conformal_error_rate: 0.05
  confidence: 0.95
  minimum_correct_label_retention: 0.90
  minimum_singleton_reliability_lower_bound: 0.80
  report_original_singleton_bound_also: 0.90
  maximum_false_singleton_EMPTY: 0
  maximum_false_singleton_REVEALED: 0

hard_stops:
  - Never use evaluator joints, segmentation, target poses, or task predicates online.
  - Never use final motor state to erase information observed earlier.
  - Never collapse a multi-label conformal set to the convenient label.
  - Never open seeds 900-999 unless every seed-1400-1439 gate passes.
