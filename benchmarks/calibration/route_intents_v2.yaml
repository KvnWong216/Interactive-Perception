schema_version: interactive-perception.intent-calibration-spec.v1
calibration_only: true
policy_primary_camera: agentview
policy_wrist_camera: robot0_eye_in_hand
wrist_camera_initialization:
  camera: robot0_eye_in_hand
  look_at: [0.25, 0.0, 0.93]
conditions:
  - label: ROTATE
    prompt: Pick up the ketchup bottle, rotate it with the wrist to inspect its label, then put it down.
    project_bddl: scenarios/information_enrichment_v0/IE03_orientation_only.bddl
  - label: MOVE_CLOSER
    prompt: Pick up the macaroni and cheese package, bring it closer to the wrist camera to inspect its label, then put it down.
    project_bddl: scenarios/information_enrichment_v0/IE02_resolution_only.bddl
