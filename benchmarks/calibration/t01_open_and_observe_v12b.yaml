schema_version: interactive-perception.open-and-observe-protocol.v12b
calibration_only: true
policy: pi05_libero
action: OPEN_AND_OBSERVE
context: t01_stock_middle_drawer_search
seed_registry: benchmarks/rss_v1/seed_registry.yaml

evidence_contract:
  history_points: [before, open_25, open_50, open_75, open_100, after_return]
  online_inputs:
    - six stock agentview RGB frames
    - six stock wrist RGB frames
    - target query fixed by the T01 prompt protocol
  online_oracle_inputs: []
  target_resolvable_pixels: 256
  target_derivation: (256 policy pixels / 16 visual tokens per side)^2
  temporal_persistence: target evidence at any history point cannot be erased later
  wrist_role: positive-only auxiliary sensor; a multi-label set is abstention
  camera_conflict_rule: preserve only singleton REVEALED versus singleton NOT_REVEALED disagreement
  outcome_rule: map every plausible target/coverage branch to its compatible outcome set
  ambiguous_outcome: SAFE_STOP
  EMPTY_never_implies_global_NOT_FOUND: true

split_contract:
  model_selection_only: [600-699, 1400-1439, 1440-1479]
  v11_not_go_then_v12b_selection: 1440-1479
  v12_overconservative_model_selection_only: 1440-1479
  disposable_pipeline_smoke: 1399
  fresh_v12b_clean_development: 1900-1939
  sealed_audit: 900-999
  custom_scenario_scope: calibration_only

statistics:
  conformal_error_rate: 0.05
  confidence: 0.95
  minimum_correct_label_retention: 0.90
  minimum_singleton_reliability_lower_bound: 0.80
  report_original_singleton_bound_also: 0.90
  maximum_false_singleton_EMPTY: 0
  maximum_false_singleton_REVEALED: 0

hard_stops:
  - Never use evaluator joints, segmentation, target poses, or task predicates online.
  - Never use final motor state to erase information observed earlier.
  - Never treat wrist multi-label abstention as positive target evidence.
  - Never collapse a multi-label conformal set to the convenient label.
  - Never open seeds 900-999 unless every seed-1900-1939 gate passes.
