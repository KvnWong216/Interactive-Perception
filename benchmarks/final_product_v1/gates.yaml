schema_version: interactive-perception.final-product-gates.v1
name: Prompt-Conditioned Interactive Perception Final Product

frozen_requirements:
  conformal_error_rate: 0.10
  capability_confidence: 0.95
  minimum_action_reliability_lower_bound: 0.80
  original_strict_action_reliability_reported_also: 0.90
  decision_rule: GO only if every blocking gate is GO; PARTIAL counts as NOT-GO

product_definition: >-
  A frozen VLA system that represents prompt-relevant, action-resolvable
  uncertainty; selects information actions by minimizing calibrated expected
  task risk; executes without simulator-only inputs; and completes the final
  task rather than stopping at target reveal.

declared_action_scope:
  current_core: [ACT, REMOVE_OCCLUDER]
  required_for_full_product: [ACT, REMOVE_OCCLUDER, MOVE_CLOSER, ROTATE, NOT_FOUND]
  rule: Adding an action reopens its capability, effect-calibration, and safety gates.

milestones:
  piu_v0_information_loop_smoke:
    status: GO
    evidence: results/smoke/piu_v0_end_to_end_v3_seed1399.json
    limitation: Disposable seed 1399; DIRECT_ACT is a semantic handoff, not physical task completion.
  t01_routed_open_prototype:
    status: GO
    evidence: results/capability/t01_conformal_reveal_100seed_v1.json
    limitation: Joint-open scoring only; RGB target reveal is not certified and final butter placement is 0/5.
  t01_prompt_state_routing:
    status: GO
    evidence: results/t01_expected_risk_router_v1.json
    limitation: Seed-disjoint T01 counterfactuals only; no learned outcome critic.
  method_paper_ready:
    status: NOT_GO
  final_product_ready:
    status: NOT_GO

gates:
  - id: FP0
    name: Stock policy reproduction
    blocking: true
    status: GO
    pass_condition: Reproduce the frozen checkpoint before any custom scene is interpreted.
    evidence: results/repro_libero_object.json
    current: 100/100.

  - id: FP1
    name: Primitive capability
    blocking: true
    status: GO
    pass_condition: >-
      Every action exposed in the current core product scope has a one-sided
      95% reliability lower bound of at least 0.80 in its declared context;
      the original 0.90 decision is reported as a stricter sensitivity check.
    evidence: results/capability/g5_executor_gate_stock_aligned_v2.json
    current: >-
      ACT 100/100; T01 drawer-joint opening 97/100. This does not certify that
      the target became visible; that stricter requirement is FP3. ROTATE is
      excluded and remains 0/30.

  - id: FP2
    name: Prompt-conditioned belief
    blocking: true
    status: PARTIAL
    pass_condition: >-
      An RGB-only model represents where prompt-relevant uncertainty lies and
      passes scene-disjoint prompt-swap calibration tests without target-pose,
      segmentation, or simulator-state inputs.
    evidence: results/calibration/prompt_state_belief_t01_audit_100seed_v1.json
    current: >-
      PIU V0 emits a structured target-location distribution and passes 27/30
      on old T01 diagnostic seeds. Only visible workspace and middle drawer are
      trained; object-level grounding, absent/other-region calibration, and
      scene-disjoint validation remain missing.

  - id: FP3
    name: Calibrated action-effect model
    blocking: true
    status: NOT_GO
    pass_condition: >-
      For every enabled information action, predict the post-action observable
      effect from (prompt, observation, action), with class-conditional
      conformal coverage at least 0.90 on disjoint scenes.
    evidence: results/smoke/piu_v0_end_to_end_v3_seed1399.json
    current: >-
      The composite executor and six-frame hierarchical critic are implemented,
      but v7 is invalidated by a final-frame-only label bug. Debug seed 770 saw
      the target during opening and lost it after return; v7 would call this
      EMPTY. The first audit stopped at 77/300 and is debug-only. Temporal-label
      v3 later froze, but v8 failed development: FAILED 7/7, REVEALED 7/9,
      EMPTY 4/5. The architecture-derived v9 correction is 20/21 on diagnosed
      seeds; untouched 660-699 must pass before seeds 900-999 can be opened.
      The v4 collector runs the controller in OffScreenRenderEnv and reads
      evaluator truth only by replay after controller termination. Local v4
      disposable smoke now passes REVEALED/EMPTY/FAILED, and the PIU smoke
      predicts all three singleton outcomes. This is not clean validation;
      seeds 660-699 remain untouched.

  - id: FP4
    name: Expected-risk optimizer
    blocking: true
    status: PARTIAL
    pass_condition: >-
      Select ACT, information acquisition, or NOT_FOUND by minimizing expected
      prompt-conditioned task risk. Decision costs come from measured action
      cost and reliability or a preregistered sensitivity analysis; no tuned
      confidence-routing threshold is permitted.
    evidence: results/t01_expected_risk_router_v1.json
    current: >-
      Finite-horizon Bayes-risk planning is implemented without a confidence
      threshold and routes 296/300 T01 counterfactuals for the target-
      observability endpoint. The current minimal runner bypasses probabilistic
      temporal q and uses hard-valid actions from deterministic phase,
      searched-set, and attempt-count memory. A five-case disposable PIU smoke
      now exercises live OPEN -> outcome -> belief update -> replan with
      explicit EIG/task utility and the 0.924 reliability lower bound. Final-task ACT risk is not ready:
      open-drawer retrieval is 0/5 and visible cream-cheese ACT is unmeasured.

  - id: FP5
    name: Oracle-free closed loop
    blocking: true
    status: PARTIAL
    pass_condition: >-
      Audit the complete controller and show zero reads of simulator joints,
      segmentation, hidden target poses, or task predicates for routing,
      stopping, belief updates, and NOT_FOUND.
    evidence: results/audits/piu_v0_privileged_input_audit.json
    current: >-
      Source/runtime guards pass for the OffScreen controller and the actual
      five-case PIU smoke. Every trace row reports zero online oracle inputs;
      segmentation and joints are confined to post-terminal evaluator replay.
      The smoke is non-paper because its learned heads are not clean-validated.

  - id: FP6
    name: Prompt-alignment counterfactuals
    blocking: true
    status: PARTIAL
    pass_condition: >-
      On the same scene with different prompts, and the same prompt with
      different resolvable causes, the correct-decision reliability lower
      bound is at least 0.90 and the method beats prompt-blind fixed rules.
    evidence: results/t01_expected_risk_router_v1.json
    current: >-
      The frozen T01 audit includes identical RGB with swapped prompts and the
      same prompt with closed/open state, and beats three prompt-blind rules.
      It does not yet cover different resolvable causes or held-out scenes.

  - id: FP7
    name: Multi-action information acquisition
    blocking: true
    status: PARTIAL
    pass_condition: >-
      Reliably acquire the required information in at least three disjoint
      action families, with a one-sided 95% lower bound of at least 0.80 for
      each family; also report the original 0.90 decision.
    evidence: results/capability/t01_conformal_reveal_100seed_v1.json
    current: >-
      Drawer opening is 97/100 by joint motion, but strict camera-visible
      information is 57/60 and passes the revised 0.80 but not the original
      0.90 lower-bound requirement;
      the return-to-observe sub-controller alone is 30/30 diagnostic-only.
      Full OPEN_AND_OBSERVE and move/rotate/other-occluder families are not certified.

  - id: FP8
    name: Final task completion
    blocking: true
    status: NOT_GO
    pass_condition: >-
      After information acquisition, complete the original final task with a
      one-sided 95% reliability lower bound of at least 0.80 and a positive
      paired improvement over the monolithic VLA.
    evidence: results/t01_final_task_risk_readiness_v1.json
    current: OPEN_CONTAINER -> ACT is 0/5; direct open-drawer retrieval is 0/5.

  - id: FP9
    name: Abstention and exhaustion
    blocking: true
    status: NOT_GO
    pass_condition: >-
      Correctly return NOT_FOUND only after calibrated search exhaustion, with
      at least 0.90 lower-bound reliability on both target-present and
      target-absent cases.
    evidence: null
    current: NOT_FOUND has no certified executor or outcome calibration.

  - id: FP10
    name: Scene and policy generalization
    blocking: true
    status: NOT_GO
    pass_condition: >-
      Pass object-, clutter-, occlusion-, and container-held-out tests and
      reproduce the decision benefit with a second frozen policy.
    evidence: null
    current: Only the T01 pi0.5 reveal path is certified.

  - id: FP11
    name: Release and reproducibility
    blocking: true
    status: PARTIAL
    pass_condition: >-
      One-command evaluation, pinned environment, frozen calibration hashes,
      complete failure demos, automated gate report, and clean GPU shutdown.
    evidence: README.md
    current: >-
      A one-command PIU information-loop smoke, immutable model/data hashes,
      training script, and oracle audit now exist. The object-level V1 frontend,
      clean paper runner, physical DIRECT_ACT continuation, and final product
      artifacts do not.
